apiVersion: v1
kind: ConfigMap
metadata:
  name: blackout-api-cors
  labels: {{- include "blackout.labels" . | nindent 4 }}
data:
  CORS_ALLOWED_ORIGINS: {{ .Values.api.cors.allowedOrigins | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackout-api
  labels: {{- include "blackout.labels" . | nindent 4 }}
    app: blackout-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: blackout-api
  template:
    metadata:
      labels:
        app: blackout-api
        {{- include "blackout.labels" . | nindent 8 }}
      {{- if .Values.api.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: blackout-api
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          env:
            - name: NODE_ENV
              value: {{ .Values.global.environment }}
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: BLACKOUT_DB_MODE
              value: {{ .Values.api.store.mode | quote }}
            - name: BLACKOUT_DB_PG_NOTIFY
              value: {{ ternary "1" "0" .Values.api.store.pgNotify | quote }}
            - name: AUTH_RATE_LIMIT_MAX
              value: {{ .Values.api.rateLimit.authMax | quote }}
            - name: CORS_ALLOW_CREDENTIALS
              value: {{ .Values.api.cors.allowCredentials | quote }}
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: blackout-api-cors
                  key: CORS_ALLOWED_ORIGINS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: blackout-api, key: DATABASE_URL }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: blackout-api, key: REDIS_URL }
            - name: JWT_SECRET_PRIMARY
              valueFrom:
                secretKeyRef: { name: blackout-api, key: JWT_SECRET_PRIMARY }
            - name: JWT_SECRET_ROLLOVER
              valueFrom:
                secretKeyRef:
                  name: blackout-api
                  key: JWT_SECRET_ROLLOVER
                  optional: true
            # Bug-report intake forwarders. All optional: with none set the API
            # degrades to a dev no-op (files no GitHub issue, skips rageshake).
            {{- if .Values.api.bugReport.rageshakeEndpointUrl }}
            - name: RAGESHAKE_ENDPOINT_URL
              value: {{ .Values.api.bugReport.rageshakeEndpointUrl | quote }}
            {{- end }}
            {{- with .Values.api.bugReport.github }}
            {{- if .owner }}
            - name: GITHUB_BUG_REPORT_OWNER
              value: {{ .owner | quote }}
            {{- end }}
            {{- if .repo }}
            - name: GITHUB_BUG_REPORT_REPO
              value: {{ .repo | quote }}
            {{- end }}
            {{- if .labels }}
            - name: GITHUB_BUG_REPORT_LABELS
              value: {{ .labels | quote }}
            {{- end }}
            {{- end }}
            # GitHub App (preferred) / PAT (fallback) creds for filing issues.
            # Sourced from the blackout-api secret and marked optional so the pod
            # still boots when issue creation isn't configured. Populate the keys
            # via externalSecrets.remoteRefs (see values.yaml).
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: blackout-api
                  key: GITHUB_APP_ID
                  optional: true
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: blackout-api
                  key: GITHUB_APP_INSTALLATION_ID
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: blackout-api
                  key: GITHUB_APP_PRIVATE_KEY
                  optional: true
            - name: GITHUB_BUG_REPORT_PAT
              valueFrom:
                secretKeyRef:
                  name: blackout-api
                  key: GITHUB_BUG_REPORT_PAT
                  optional: true
            {{- if .Values.api.metrics.enabled }}
            - name: INTERNAL_METRICS_TOKEN
              valueFrom:
                secretKeyRef: { name: blackout-api, key: {{ .Values.api.metrics.tokenSecretKey }} }
            {{- end }}
            {{- if .Values.api.observability.sentry.enabled }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef: { name: blackout-api, key: SENTRY_DSN }
            - name: SENTRY_TRACES_SAMPLE_RATE
              value: {{ .Values.api.observability.sentry.tracesSampleRate | quote }}
            {{- end }}
            {{- if .Values.api.observability.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.api.observability.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: blackout-api
            {{- end }}
          # In postgres mode the pod runs migrations + hydrates the in-memory
          # mirror before it begins serving /health, so give startup generous
          # headroom (up to ~150s) before liveness/readiness engage.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: blackout-api
  labels: {{- include "blackout.labels" . | nindent 4 }}
    app: blackout-api
spec:
  selector:
    app: blackout-api
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blackout-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blackout-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCpuUtilization }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blackout-api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      app: blackout-api
