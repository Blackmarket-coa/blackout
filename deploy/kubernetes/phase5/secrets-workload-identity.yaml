apiVersion: v1
kind: ServiceAccount
metadata:
    name: element-web
    namespace: element-web
    annotations:
        # Replace with your platform-specific workload identity annotation.
        # Example for GKE:
        # iam.gke.io/gcp-service-account: element-web@PROJECT_ID.iam.gserviceaccount.com
        workload.identity/enabled: "true"
---
# External Secrets Operator example using Vault as source of truth.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
    name: vault-backend
    namespace: element-web
spec:
    provider:
        vault:
            server: https://vault.example.internal
            path: kv
            version: v2
            auth:
                kubernetes:
                    mountPath: kubernetes
                    role: element-web
                    serviceAccountRef:
                        name: element-web
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
    name: element-web-runtime
    namespace: element-web
spec:
    refreshInterval: 1h
    secretStoreRef:
        name: vault-backend
        kind: SecretStore
    target:
        name: element-web-runtime
        creationPolicy: Owner
    data:
        - secretKey: oidc_client_secret
          remoteRef:
              key: element-web/prod
              property: oidc_client_secret
