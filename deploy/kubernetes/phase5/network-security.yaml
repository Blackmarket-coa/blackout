apiVersion: v1
kind: Namespace
metadata:
    name: element-web
    labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
---
# Default deny all ingress and egress for application pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: default-deny-all
    namespace: element-web
spec:
    podSelector: {}
    policyTypes:
        - Ingress
        - Egress
---
# Allow DNS egress for name resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: allow-dns-egress
    namespace: element-web
spec:
    podSelector: {}
    policyTypes:
        - Egress
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
---
# Allow ingress from ingress-nginx namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: allow-ingress-controller
    namespace: element-web
spec:
    podSelector:
        matchLabels:
            app: element
    policyTypes:
        - Ingress
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: ingress-nginx
          ports:
              - protocol: TCP
                port: 80
