# Blackout API (packages/api Hono service) — multi-replica deployment.
#
# Requires:
#   - secret "blackout-api" with keys:
#       JWT_SECRET_PRIMARY, DATABASE_URL, REDIS_URL, SENTRY_DSN (optional)
#   - configmap "blackout-api-cors" with key CORS_ALLOWED_ORIGINS
#   - the redis StatefulSet defined in redis.yaml (or an externally-managed Redis)
#
# Image: ghcr.io/blackout/api:<tag>. Tag is set per-environment in CI/Helm values.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: blackout-api
    labels:
        app: blackout-api
spec:
    replicas: 3
    selector:
        matchLabels:
            app: blackout-api
    template:
        metadata:
            labels:
                app: blackout-api
            annotations:
                prometheus.io/scrape: 'true'
                prometheus.io/port: '3000'
                prometheus.io/path: '/metrics'
        spec:
            terminationGracePeriodSeconds: 30
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                      matchLabels:
                          app: blackout-api
            containers:
                - name: api
                  image: ghcr.io/blackout/api:stable
                  ports:
                      - containerPort: 3000
                        name: http
                  env:
                      - name: NODE_ENV
                        value: production
                      - name: PORT
                        value: '3000'
                      # Postgres store, write-behind: a mutation updates the replica's
                      # in-memory mirror and returns; its Postgres write is queued and
                      # runs just after, so a crash before it runs loses it (the
                      # db_write_behind_failures_total metric counts writes that failed).
                      # pg_notify (LISTEN/NOTIFY) tells the other replicas which rows changed
                      # so each re-reads them. Consistency is EVENTUAL: a replica can serve
                      # the old value until the notification arrives, and a single-use check
                      # (a reset token, a refresh rotation) can pass once on each replica in
                      # that window. Some replicas never hear of a change: one that starts
                      # while others write, every one when a write's notification fails to
                      # send (most writes send it after the write, and the failure is only
                      # logged), and one whose listening connection dies without an error.
                      # Each serves the old row until it restarts or re-reads it, so a
                      # sign-out made elsewhere can be ignored there until the token expires
                      # (up to 24 h; see KNOWN_LIMITATIONS.md). Endpoints that need
                      # read-your-write should route through the writing replica; waiting
                      # does not help a replica that missed the notification. A write names
                      # only the rows it changed; see
                      # docs/security/store-cross-process-writes-2026-10-31.md for what that
                      # covers and for rolling out the release that made it so. If pg_notify
                      # is disabled below, this deployment MUST scale to exactly one replica.
                      - name: BLACKOUT_DB_MODE
                        value: 'postgres'
                      - name: BLACKOUT_DB_PG_NOTIFY
                        value: '1'
                      - name: DATABASE_URL
                        valueFrom:
                            secretKeyRef: { name: blackout-api, key: DATABASE_URL }
                      - name: REDIS_URL
                        valueFrom:
                            secretKeyRef: { name: blackout-api, key: REDIS_URL }
                      - name: JWT_SECRET_PRIMARY
                        valueFrom:
                            secretKeyRef: { name: blackout-api, key: JWT_SECRET_PRIMARY }
                      - name: CORS_ALLOWED_ORIGINS
                        valueFrom:
                            configMapKeyRef: { name: blackout-api-cors, key: CORS_ALLOWED_ORIGINS }
                      - name: CORS_ALLOW_CREDENTIALS
                        value: 'true'
                      - name: AUTH_RATE_LIMIT_MAX
                        value: '10'
                  # In postgres mode the pod migrates + hydrates the in-memory mirror
                  # before serving /health; give startup headroom (~150s) before
                  # liveness/readiness engage so it isn't killed mid-hydrate.
                  startupProbe:
                      httpGet:
                          path: /health
                          port: http
                      periodSeconds: 5
                      failureThreshold: 30
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: http
                      initialDelaySeconds: 2
                      periodSeconds: 5
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: http
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: 1000m
                          memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
    name: blackout-api
    labels:
        app: blackout-api
spec:
    selector:
        app: blackout-api
    ports:
        - name: http
          port: 80
          targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: blackout-api
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: blackout-api
    minReplicas: 3
    maxReplicas: 12
    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: blackout-api
spec:
    minAvailable: 2
    selector:
        matchLabels:
            app: blackout-api
