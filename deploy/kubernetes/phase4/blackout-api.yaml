# Blackout API (packages/api Hono service) — multi-replica deployment.
#
# Requires:
#   - secret "blackout-api" with keys:
#       JWT_SECRET_PRIMARY, DATABASE_URL, REDIS_URL, SENTRY_DSN (optional)
#   - configmap "blackout-api-cors" with key CORS_ALLOWED_ORIGINS
#   - the redis StatefulSet defined in redis.yaml (or an externally-managed Redis)
#
# Image: ghcr.io/blackout/api:<tag>. Tag is set per-environment in CI/Helm values.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: blackout-api
    labels:
        app: blackout-api
spec:
    replicas: 3
    selector:
        matchLabels:
            app: blackout-api
    template:
        metadata:
            labels:
                app: blackout-api
            annotations:
                prometheus.io/scrape: 'true'
                prometheus.io/port: '3000'
                prometheus.io/path: '/metrics'
        spec:
            terminationGracePeriodSeconds: 30
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                      matchLabels:
                          app: blackout-api
            containers:
                - name: api
                  image: ghcr.io/blackout/api:stable
                  ports:
                      - containerPort: 3000
                        name: http
                  env:
                      - name: NODE_ENV
                        value: production
                      - name: PORT
                        value: '3000'
                      # Write-through Postgres store. Multi-replica safe: pg_notify keeps
                      # each replica's in-memory read mirror coherent via LISTEN/NOTIFY.
                      # Consistency is EVENTUAL — there is a bounded (sub-second) stale-read
                      # window equal to the NOTIFY propagation latency; durability is not
                      # affected (writes commit to Postgres synchronously). Endpoints that
                      # need read-your-write within that window should route through the
                      # writing replica or re-read after a short delay. If pg_notify is
                      # disabled below, this deployment MUST scale to exactly one replica.
                      - name: BLACKOUT_DB_MODE
                        value: 'postgres'
                      - name: BLACKOUT_DB_PG_NOTIFY
                        value: '1'
                      - name: DATABASE_URL
                        valueFrom:
                            secretKeyRef: { name: blackout-api, key: DATABASE_URL }
                      - name: REDIS_URL
                        valueFrom:
                            secretKeyRef: { name: blackout-api, key: REDIS_URL }
                      - name: JWT_SECRET_PRIMARY
                        valueFrom:
                            secretKeyRef: { name: blackout-api, key: JWT_SECRET_PRIMARY }
                      - name: CORS_ALLOWED_ORIGINS
                        valueFrom:
                            configMapKeyRef: { name: blackout-api-cors, key: CORS_ALLOWED_ORIGINS }
                      - name: CORS_ALLOW_CREDENTIALS
                        value: 'true'
                      - name: AUTH_RATE_LIMIT_MAX
                        value: '10'
                  # In postgres mode the pod migrates + hydrates the in-memory mirror
                  # before serving /health; give startup headroom (~150s) before
                  # liveness/readiness engage so it isn't killed mid-hydrate.
                  startupProbe:
                      httpGet:
                          path: /health
                          port: http
                      periodSeconds: 5
                      failureThreshold: 30
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: http
                      initialDelaySeconds: 2
                      periodSeconds: 5
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: http
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: 1000m
                          memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
    name: blackout-api
    labels:
        app: blackout-api
spec:
    selector:
        app: blackout-api
    ports:
        - name: http
          port: 80
          targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: blackout-api
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: blackout-api
    minReplicas: 3
    maxReplicas: 12
    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: blackout-api
spec:
    minAvailable: 2
    selector:
        matchLabels:
            app: blackout-api
