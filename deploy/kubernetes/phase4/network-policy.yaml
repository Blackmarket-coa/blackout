# NetworkPolicy for blackout-api namespace.
# Restricts ingress to the ingress controller and egress to known services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackout-api
  labels:
    app: blackout-api
spec:
  podSelector:
    matchLabels:
      app: blackout-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: blackout-redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: blackout-postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
