apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: element-edge-protected
    namespace: element-web
    annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/limit-rps: "20"
        nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
        nginx.ingress.kubernetes.io/enable-modsecurity: "true"
        nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
        nginx.ingress.kubernetes.io/http-snippet: |
            limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
            limit_req_zone $binary_remote_addr zone=media_zone:20m rate=30r/m;
            limit_req_zone $binary_remote_addr zone=federation_zone:20m rate=60r/m;
        nginx.ingress.kubernetes.io/server-snippet: |
            location ~* ^/(login|register) {
              limit_req zone=auth_zone burst=20 nodelay;
            }
            location ~* ^/_matrix/media {
              limit_req zone=media_zone burst=40 nodelay;
            }
            location ~* ^/_matrix/federation {
              limit_req zone=federation_zone burst=60 nodelay;
            }
spec:
    rules:
        - host: element.example.com
          http:
              paths:
                  - pathType: Prefix
                    path: /
                    backend:
                        service:
                            name: element
                            port:
                                number: 80
