# Strict-Transport-Security for the HTTPS server in ../nginx.conf.
#
# nginx drops every add_header a block inherits as soon as that block (a
# location, or an `if` inside one) sets any add_header of its own. A block that
# adds its own headers must therefore include this file again, or its responses
# go out without HSTS. It is included at server level as well, in place of a
# literal add_header, so the value is defined once.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
