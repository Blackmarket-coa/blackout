worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream synapse_upstream {
    server synapse:8008;
  }

  upstream lk_jwt_upstream {
    server lk-jwt-service:8080;
  }

  upstream livekit_upstream {
    server livekit:7880;
  }

  upstream mas_upstream {
    server mas:8080;
  }

  upstream synapse_admin_upstream {
    server synapse-admin:80;
  }

  upstream rageshake_upstream {
    server rageshake:9110;
  }

  upstream mmr_upstream {
    server matrix-media-repo:8000;
  }

  upstream dimension_upstream {
    server dimension:8184;
  }

  upstream maubot_upstream {
    server maubot:29316;
  }

  upstream matrix_registration_upstream {
    server matrix-registration:5000;
  }

  resolver 127.0.0.11 valid=30s ipv6=off;

  server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME};

    location /.well-known/matrix/client {
      default_type application/json;
      alias /var/www/well-known-rendered/matrix/client;
    }

    location /.well-known/matrix/server {
      default_type application/json;
      alias /var/www/well-known-rendered/matrix/server;
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${SERVER_NAME};

    ssl_certificate /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upstream gateway errors (502/503/504 from nginx itself when Synapse/MAS
    # are unreachable) bypass the location's add_header directives, which
    # surfaces in the browser as a misleading "blocked by CORS policy" error
    # on /_matrix/client/v3/register and /login preflights. Route those
    # nginx-generated errors to a named location with CORS headers attached.
    error_page 502 = @matrix_cors_error;
    error_page 503 = @matrix_cors_error;
    error_page 504 = @matrix_cors_error;

    location @matrix_cors_error {
      default_type application/json;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;
      add_header Access-Control-Expose-Headers "Synapse-Trace-Id, Server" always;
      return 503 '{"errcode":"M_UNKNOWN","error":"Homeserver temporarily unavailable, please retry shortly"}';
    }

    location /.well-known/matrix/client {
      default_type application/json;
      alias /var/www/well-known-rendered/matrix/client;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=300";
    }

    location /.well-known/matrix/server {
      default_type application/json;
      alias /var/www/well-known-rendered/matrix/server;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=300";
    }

    location ~ ^/_matrix/client/(.*)/(login|logout|refresh)$ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_pass http://mas_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /.well-known/openid-configuration {
      proxy_pass http://mas_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /_oauth/ {
      proxy_pass http://mas_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /account/ {
      proxy_pass http://mas_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    # matrix-media-repo (MMR) takes precedence over Synapse's media endpoints
    # when the `media-repo` compose profile is running. When MMR is not
    # running, this block fails resolution and Synapse handles media via the
    # generic /_matrix/* route below.
    location ~ ^(/_matrix/media|/_matrix/client/v1/media|/_matrix/federation/v1/media) {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_pass http://mmr_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      client_max_body_size 100M;
    }

    location ~ ^(/_matrix|/_synapse/client) {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }
      # CORS headers on every response — including 401 UIA challenges from
      # /register and /login flows — so the browser can read them.
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;
      add_header Access-Control-Expose-Headers "Synapse-Trace-Id, Server" always;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_pass http://synapse_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      client_max_body_size 100M;
    }

    location /admin/ {
      proxy_pass http://synapse_admin_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /rageshake/ {
      proxy_pass http://rageshake_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      client_max_body_size 25M;
    }

    location /dimension/ {
      proxy_pass http://dimension_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /_matrix/maubot/ {
      proxy_pass http://maubot_upstream/_matrix/maubot/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /register/ {
      proxy_pass http://matrix_registration_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /livekit/jwt/ {
      proxy_pass http://lk_jwt_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /livekit/sfu/ {
      proxy_pass http://livekit_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 86400;
    }

    location / {
      set $blackout_app http://blackout-app:80;
      proxy_pass $blackout_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
}
