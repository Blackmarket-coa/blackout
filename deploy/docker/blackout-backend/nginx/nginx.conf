worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream synapse_upstream {
    server synapse:8008;
  }

  upstream lk_jwt_upstream {
    server lk-jwt-service:8080;
  }

  upstream livekit_upstream {
    server livekit:7880;
  }

  upstream blackout_app_upstream {
    server blackout-app:80;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME};

    location /.well-known/matrix/client {
      default_type application/json;
      alias /var/www/well-known-rendered/matrix/client;
    }

    location /.well-known/matrix/server {
      default_type application/json;
      alias /var/www/well-known-rendered/matrix/server;
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${SERVER_NAME};

    ssl_certificate /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /.well-known/matrix/client {
      default_type application/json;
      alias /var/www/well-known-rendered/matrix/client;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=300";
    }

    location /.well-known/matrix/server {
      default_type application/json;
      alias /var/www/well-known-rendered/matrix/server;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=300";
    }

    location /_matrix/ {
      proxy_pass http://synapse_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      client_max_body_size 100M;
    }

    location /livekit/jwt/ {
      proxy_pass http://lk_jwt_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /livekit/sfu/ {
      proxy_pass http://livekit_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 86400;
    }

    location / {
      proxy_pass http://blackout_app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
}
