openapi: 3.0.3
info:
  title: Blackout API
  version: 1.0.0
  description: Canonical /v1 API surface for Blackout.
servers:
  - url: /v1
paths:
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
    post:
      operationId: createChannel
      tags: [channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
  /messages/{channelId}:
    get:
      operationId: listMessages
      tags: [messages]
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
        - in: query
          name: before
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiMessage'
    post:
      operationId: createMessage
      tags: [messages]
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /governance/votes:
    post:
      operationId: createVote
      tags: [governance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoteRequest'
      responses:
        '201':
          description: Vote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vote'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /governance/votes/{voteId}:
    get:
      operationId: getVote
      tags: [governance]
      parameters:
        - in: path
          name: voteId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVoteResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /governance/votes/{voteId}/cast:
    post:
      operationId: castVote
      tags: [governance]
      parameters:
        - in: path
          name: voteId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastVoteRequest'
      responses:
        '200':
          description: Vote cast
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastVoteResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /federation/links:
    post:
      operationId: linkCommunities
      tags: [federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCommunitiesRequest'
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationLink'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /federation/communities:
    get:
      operationId: getFederatedCommunities
      tags: [federation]
      parameters:
        - in: query
          name: ids
          required: false
          schema:
            type: string
            description: Comma-separated community ids.
      responses:
        '200':
          description: Communities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedCommunitiesResponse'
components:
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
    RegisterResponse:
      type: object
      required: [token, userId, matrix]
      properties:
        token:
          type: string
        userId:
          type: string
        matrix:
          type: object
          additionalProperties: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [token, userId]
      properties:
        token:
          type: string
        userId:
          type: string
    GovernanceMetadata:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
        data:
          type: object
          additionalProperties: true
    ApiMessage:
      type: object
      required: [id, channelId, userId, content, contentStegoTier, createdAt]
      properties:
        id:
          type: string
        channelId:
          type: string
        userId:
          type: string
        username:
          type: string
        content:
          type: string
        contentStegoTier:
          type: number
        createdAt:
          type: string
        governance:
          $ref: '#/components/schemas/GovernanceMetadata'
    CreateMessageRequest:
      type: object
      required: [content, userId]
      properties:
        content:
          type: string
        stegoTier:
          type: number
        sign:
          type: boolean
        userId:
          type: string
        matrixRoomId:
          type: string
        governance:
          $ref: '#/components/schemas/GovernanceMetadata'
    CreateMessageResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: '#/components/schemas/ApiMessage'
        matrix:
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
    CreateVoteRequest:
      type: object
      required: [communityId, proposerId, title]
      properties:
        communityId:
          type: string
        proposerId:
          type: string
        title:
          type: string
        description:
          type: string
        options:
          type: array
          items:
            type: string
        durationHours:
          type: number
    VoteOption:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
    Vote:
      type: object
      required: [id, communityId, proposerId, title, voteType, options, requiresQuorum, durationHours, status]
      properties:
        id:
          type: string
        communityId:
          type: string
        proposerId:
          type: string
        title:
          type: string
        description:
          type: string
        voteType:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/VoteOption'
        requiresQuorum:
          type: number
        durationHours:
          type: number
        status:
          type: string
    GetVoteResponse:
      allOf:
        - $ref: '#/components/schemas/Vote'
        - type: object
          required: [results]
          properties:
            results:
              type: object
              additionalProperties:
                type: number
    CastVoteRequest:
      type: object
      required: [userId, choice]
      properties:
        userId:
          type: string
        choice:
          type: string
        weight:
          type: number
    CastVoteResponse:
      type: object
      required: [success, tally]
      properties:
        success:
          type: boolean
        tally:
          type: object
          additionalProperties:
            type: number
    CreateChannelRequest:
      type: object
      required: [communityId, name]
      properties:
        communityId:
          type: string
        name:
          type: string
        description:
          type: string
        channelType:
          type: string
        isPrivate:
          type: boolean
        matrixRoomId:
          type: string
    Channel:
      type: object
      required: [id, communityId, name, channelType, isPrivate]
      properties:
        id:
          type: string
        communityId:
          type: string
        name:
          type: string
        description:
          type: string
        channelType:
          type: string
        isPrivate:
          type: boolean
        matrixRoomId:
          type: string
    LinkCommunitiesRequest:
      type: object
      required: [sourceCommunityId, targetCommunityId]
      properties:
        sourceCommunityId:
          type: string
        targetCommunityId:
          type: string
        linkType:
          type: string
        matrixBridgeRoomId:
          type: string
    FederationLink:
      type: object
      required: [id, sourceCommunityId, targetCommunityId, linkType, matrixBridgeRoomId, isActive]
      properties:
        id:
          type: string
        sourceCommunityId:
          type: string
        targetCommunityId:
          type: string
        linkType:
          type: string
        matrixBridgeRoomId:
          type: string
        isActive:
          type: boolean
    FederatedCommunitiesResponse:
      type: object
      required: [communities]
      properties:
        communities:
          type: array
          items:
            type: string
