upstream blackout_web {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream blackout_api {
    server 127.0.0.1:9000;
    keepalive 64;
}

upstream blackout_synapse {
    # Synapse default unencrypted listener behind reverse proxy.
    server 127.0.0.1:8008;
    keepalive 64;
}

upstream blackout_turn_admin {
    # Optional: expose TURN health/admin endpoint over HTTPS.
    server 127.0.0.1:9641;
    keepalive 16;
}

# HTTP -> HTTPS redirect for all required hostnames.
server {
    listen 80;
    listen [::]:80;
    server_name theblackout.app chat.theblackout.app matrix.theblackout.app api.theblackout.app turn.theblackout.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Black Mask chat panel framing. Used only by the two /embed locations in the
# next server block; docs/black-mask-chat-panel-and-account-link.md (step 2).
#
# The client container (apps/blackout-client image) decides whether the panel
# may be framed, from BLACK_MASK_FRAME_ANCESTORS. Browsers enforce every
# Content-Security-Policy a response carries, so this proxy's own
# frame-ancestors 'none' would block the panel whatever the container allows.
# On the panel locations the proxy therefore drops its own X-Frame-Options and
# leaves frame-ancestors out of its own CSP, but only when all three hold:
#   1. The raw request URI is the panel's, by the same test the client image
#      applies. nginx normalises /%65mbed/ and the like into the panel
#      locations; those keep this proxy's headers.
#   2. The container's Content-Security-Policy, as nginx reads it, is exactly
#      one frame-ancestors list in the form 40-black-mask-frame-ancestors.sh
#      writes: 'none' alone, or lower-case scheme://host[:port] origins (so no
#      'self', wildcard, path or other directive). nginx 1.23 and later join
#      repeated headers with ", ", which fails this test; older nginx reads
#      only the first header.
#   3. nginx read the container's whole response header block. When a block
#      turns out cut off, invalid or too large, nginx answers 502 or 504 itself
#      but still holds the lines it parsed before that, CSP included.
#      $upstream_header_time is "-" for such an attempt and a time for a
#      complete one. When nginx tries several upstream servers it is a list,
#      and only its last entry, the attempt nginx answered from, counts.
# The proxy then repeats that frame-ancestors list in a CSP header of its own:
# nginx also reads a header spelled Content_Security_Policy here, which a
# browser ignores, so the proxy does not rely on the container's spelling.
# In every other case (no CSP, a CSP without frame-ancestors, several CSP
# headers on nginx 1.23 or later, the container down or not answering in time,
# an incomplete header block) the panel locations send exactly the
# security-headers.conf set. Not covered: a response nginx makes itself after
# a complete header block with the list, because of that block (its 404 for an
# X-Accel-Redirect it refuses, its 500 when one loops), goes out under the
# list as well. The client image sends no X-Accel-Redirect.
#
# nginx computes a map value the first time a request uses it and keeps it for
# the rest of that request. Only the add_header lines in the panel locations use
# these, and they run after the upstream has answered. Using them anywhere that
# runs earlier (proxy_set_header, for one) would fix them at the fail-safe
# values. tools/ci/check-embed-proxy-framing.mjs pins the maps and the two
# locations and checks both CSP strings against security-headers.conf.
map $request_uri $black_mask_panel_uri {
    default 0;
    "~^/embed(\?|$)" 1;
    "~^/embed/" 1;
}

map $upstream_http_content_security_policy $black_mask_panel_upstream_frames {
    default 0;
    "~^frame-ancestors ('none'|[a-z][a-z0-9+.-]*://[a-z0-9.-]+(:[0-9]+)?( [a-z][a-z0-9+.-]*://[a-z0-9.-]+(:[0-9]+)?)*)$" 1;
}

map $upstream_header_time $black_mask_panel_upstream_complete {
    default 0;
    "~(^| )[0-9]+\.[0-9]+$" 1;
}

map $black_mask_panel_uri$black_mask_panel_upstream_frames$black_mask_panel_upstream_complete $black_mask_panel_x_frame_options {
    default "DENY";
    111 "";
}

map $black_mask_panel_uri$black_mask_panel_upstream_frames$black_mask_panel_upstream_complete $black_mask_panel_csp {
    default "default-src 'self'; connect-src 'self' https://api.theblackout.app https://matrix.theblackout.app wss://matrix.theblackout.app; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    111 "default-src 'self'; connect-src 'self' https://api.theblackout.app https://matrix.theblackout.app wss://matrix.theblackout.app; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'";
}

map $black_mask_panel_uri$black_mask_panel_upstream_frames$black_mask_panel_upstream_complete $black_mask_panel_frame_ancestors {
    default "";
    111 $upstream_http_content_security_policy;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theblackout.app chat.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # API: proxy `/v1/*` to the Blackout API instead of falling through to
    # the SPA's index.html. Without this, fetch('/v1/...') from the chat
    # origin returns HTML and the SDK throws HTTP_BAD_RESPONSE.
    location /v1/ {
        proxy_pass http://blackout_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-friendly defaults: widget alerts (and other streaming
        # endpoints) need unbuffered, long-lived upstream connections.
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
    }

    # Share-link OG previews: `/i/<token>` is served by the API (server-rendered
    # Open Graph tags so TikTok/Instagram/Discord unfurl the link), not the SPA.
    # Must come before the `/` fallback so bio links on the apex domain reach
    # the API and produce a real preview card.
    location /i/ {
        proxy_pass http://blackout_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Campaign OG previews: `/c/<slug>/<campaignId>` is server-rendered by the
    # API for the same reason as `/i/`. Without this rule a shared campaign hits
    # the SPA shell and unfurls as a generic "Blackout Client" card naming
    # neither the campaign nor the coalition. Must also precede `/`.
    location /c/ {
        proxy_pass http://blackout_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Black Mask chat panel: the client image's two panel locations (/embed and
    # /embed/*; /embedded is not the panel), proxied exactly as `location /`
    # proxies. The maps above the server block decide the framing headers.
    # Declaring add_header here drops every header inherited from the server
    # block, so both locations restate the security-headers.conf set: HSTS from
    # hsts.conf, the rest below. The add_header lines carry the per-line
    # nosemgrep of #958's convention, so that if semgrep's header-redefinition
    # rule (which cannot see includes) ever reports them, the reason is next to
    # them. semgrep 1.36.0 does not report them today.
    location = /embed {
        proxy_pass http://blackout_web;
        include /etc/nginx/snippets/hsts.conf;
        add_header X-Frame-Options $black_mask_panel_x_frame_options always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Content-Type-Options "nosniff" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), usb=(), payment=()" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy $black_mask_panel_csp always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy $black_mask_panel_frame_ancestors always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
    }

    location ^~ /embed/ {
        proxy_pass http://blackout_web;
        include /etc/nginx/snippets/hsts.conf;
        add_header X-Frame-Options $black_mask_panel_x_frame_options always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Content-Type-Options "nosniff" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), usb=(), payment=()" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy $black_mask_panel_csp always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy $black_mask_panel_frame_ancestors always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
    }

    location / {
        proxy_pass http://blackout_web;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://blackout_api;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    # Every block below that sets its own add_header loses this one, so each
    # of them includes hsts.conf again (see the comment in that file). Their
    # add_header lines carry nosemgrep: semgrep's header-redefinition rule
    # flags any add_header in a location and cannot see the include.
    include /etc/nginx/snippets/hsts.conf;

    # Upstream errors (Synapse restart, brief timeout, gateway failure) generate
    # nginx-internal responses that bypass the matrix location's add_header
    # directives, so the browser surfaces a confusing "blocked by CORS policy"
    # error instead of the real upstream condition. Route those statuses to a
    # named location that returns a Matrix-shaped JSON body with CORS headers.
    error_page 502 = @matrix_cors_error;
    error_page 503 = @matrix_cors_error;
    error_page 504 = @matrix_cors_error;

    location @matrix_cors_error {
        default_type application/json;
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Expose-Headers "Synapse-Trace-Id, Server" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        return 503 '{"errcode":"M_UNKNOWN","error":"Homeserver temporarily unavailable, please retry shortly"}';
    }

    # Federation and server-to-server endpoints: no CORS (not browser-facing).
    location ~ ^/_matrix/(federation|key)/ {
        proxy_pass http://blackout_synapse;
    }

    # Matrix Client-Server, media, identity, and Synapse client APIs.
    # Browser-facing: must answer CORS preflight and propagate CORS headers
    # on responses (including 401 UIA challenges from /register and /login).
    # IMPORTANT: keep proxy_pass without URI rewrite to preserve path semantics.
    location ~ ^(/_matrix/(client|media|identity|static)|/_synapse/client) {
        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/hsts.conf;
            add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Max-Age 86400 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Content-Length 0 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            return 204;
        }
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Expose-Headers "Synapse-Trace-Id, Server" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        # Strip any CORS headers Synapse may add to avoid duplicates.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_pass http://blackout_synapse;
    }

    # Matrix discovery endpoints
    location = /.well-known/matrix/server {
        default_type application/json;
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        return 200 '{"m.server":"matrix.theblackout.app:443"}';
    }

    location = /.well-known/matrix/client {
        default_type application/json;
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        return 200 '{"m.homeserver":{"base_url":"https://matrix.theblackout.app"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://matrix.theblackout.app/livekit/jwt"}]}';
    }

    # Anything else on matrix host is rejected explicitly.
    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turn.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Optional HTTPS status endpoint if TURN admin/metrics is enabled.
    location /healthz {
        proxy_pass http://blackout_turn_admin/healthz;
    }

    location / {
        return 404;
    }
}
