upstream blackout_web {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream blackout_api {
    server 127.0.0.1:9000;
    keepalive 64;
}

upstream blackout_synapse {
    # Synapse default unencrypted listener behind reverse proxy.
    server 127.0.0.1:8008;
    keepalive 64;
}

upstream blackout_turn_admin {
    # Optional: expose TURN health/admin endpoint over HTTPS.
    server 127.0.0.1:9641;
    keepalive 16;
}

# HTTP -> HTTPS redirect for all required hostnames.
server {
    listen 80;
    listen [::]:80;
    server_name theblackout.app chat.theblackout.app matrix.theblackout.app api.theblackout.app turn.theblackout.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theblackout.app chat.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://blackout_web;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://blackout_api;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Matrix Client-Server and Federation APIs.
    # IMPORTANT: keep proxy_pass without URI rewrite to preserve path semantics.
    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://blackout_synapse;
    }

    # Matrix discovery endpoints
    location = /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"m.server":"matrix.theblackout.app:443"}';
    }

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.theblackout.app"}}';
    }

    # Anything else on matrix host is rejected explicitly.
    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turn.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Optional HTTPS status endpoint if TURN admin/metrics is enabled.
    location /healthz {
        proxy_pass http://blackout_turn_admin/healthz;
    }

    location / {
        return 404;
    }
}
