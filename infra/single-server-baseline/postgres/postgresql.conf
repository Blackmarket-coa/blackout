# Blackout Postgres baseline tuning — single-server consolidated stack.
#
# Sized for the consolidated DL360 host described in
# AGGRESSIVE_OPERATIONS_GUIDE.md §2.4 and §4.1, where Postgres simultaneously
# serves Synapse state tables, the Blackout API schema, and (after the
# Foundation milestone migration) the FBM Medusa schema. The host has 384 GB
# RAM and 40 CPU threads; this config allocates roughly ~32 GB of memory
# headroom to Postgres so the rest of the stack (Synapse, ClickHouse, the
# spatial layer) is not crowded.
#
# Posture: conservative. Real workload bands are not yet established
# (§4.1 explicitly defers capacity bands until telemetry exists). It is
# easier to widen these knobs based on observed waits than to debug
# autovacuum starvation from over-aggressive settings.
#
# Wired in via infra/single-server-baseline/docker-compose.yml — postgres
# starts with `-c config_file=/etc/postgresql/postgresql.conf`. To tune
# further, edit this file and restart the service; restart-only changes
# can be applied with `pg_ctl reload` for non-restart parameters but for
# the memory knobs below a service restart is required.
#
# Re-evaluate when any of the following are true:
#   - Federation sender backlog (matrix_federation_sender_backlog) climbs
#     into the seconds range; widen work_mem and effective_io_concurrency.
#   - Autovacuum is failing to keep up on Synapse state_groups_state
#     (n_dead_tup growth outpacing autovacuum runs); raise
#     autovacuum_max_workers and lower autovacuum_vacuum_scale_factor.
#   - The host adds significant additional services (the spatial PostGIS
#     workload at scale); reconsider the 32 GB allocation.
#
# Reference: PGTune defaults for "OLTP" workload at 32 GB / 40 CPU /
# SSD, then biased toward Synapse-style write-heavy patterns.

# ---------------- Connections and concurrency ----------------------------
listen_addresses = '*'
max_connections = 300
# A connection pooler (pgBouncer) is the long-term fix for high
# connection counts; until then, 300 leaves headroom for Synapse
# (cp_max=15), Blackout API, FBM, and ad-hoc maintenance sessions.

# ---------------- Memory --------------------------------------------------
shared_buffers = 8GB
# 25% of allocated 32 GB. Postgres keeps frequently-accessed pages here.

effective_cache_size = 24GB
# Hint to the planner; not an actual allocation. ~75% of allocated memory
# acknowledging that the OS page cache also holds Postgres data.

work_mem = 32MB
# Per sort/hash node. Multiplied by parallel workers per query. Stay
# conservative until telemetry shows planner spilling to disk.

maintenance_work_mem = 2GB
# Vacuum, analyze, index builds. Big helps Synapse state-table maintenance.

huge_pages = try
# Postgres prefers huge pages on Linux when available; "try" is a no-op
# fallback if the kernel does not provide them.

# ---------------- WAL and checkpoints ------------------------------------
wal_level = replica
# Required for streaming replication to the secondary server (Differentiation
# milestone deliverable per §4.2).

max_wal_size = 4GB
min_wal_size = 1GB
# Bigger WAL = fewer checkpoints, smoother latency. Sized for the busy
# Synapse + FBM mixed workload.

checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

wal_compression = on
# CPU-cheap compression; reduces WAL volume and replication bandwidth.

# ---------------- Parallelism --------------------------------------------
max_worker_processes = 16
max_parallel_workers_per_gather = 4
max_parallel_workers = 16
max_parallel_maintenance_workers = 4
# DL360 has 40 threads; reserve roughly half for non-Postgres consumers.

# ---------------- Planner / I/O ------------------------------------------
random_page_cost = 1.1
# SSD-resident; do not let the planner think random reads are 4x sequential.

effective_io_concurrency = 200
# SSD-typical; raise further if backed by NVMe and observed wait events
# point at I/O concurrency.

# ---------------- Autovacuum ---------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
# Synapse's state_groups_state, events, and event_to_state_groups churn
# heavily. The defaults (3 workers, 60s nap) are too lazy for a Synapse
# host carrying real federation load; this profile starts a bit more
# aggressive without going all the way to "vacuum constantly."

autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
# Vacuum/analyze when ~5%/2.5% of rows have changed, vs. 20%/10% defaults.

# ---------------- Logging -------------------------------------------------
log_min_duration_statement = 500ms
# Anything slower than 500ms gets logged; balances signal vs. noise.

log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1s
# Surface autovacuum runs that take more than a second; Synapse autovacuum
# starvation is a §4.1 watch-item.

log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# ---------------- Statistics ---------------------------------------------
track_io_timing = on
# Required for pg_stat_statements I/O attribution and Grafana panels.

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

# ---------------- Locale --------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'

# ---------------- Connection lifetime ------------------------------------
idle_in_transaction_session_timeout = 5min
statement_timeout = 0
# Synapse and FBM run their own statement timeouts; do not double-enforce.

# ---------------- TLS ----------------------------------------------------
# Trust the docker-network boundary for in-cluster traffic. If you front
# Postgres with a proxy or expose it beyond the data network, set
# ssl = on and provide certs.
