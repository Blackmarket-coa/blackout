user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Matrix federation signatures are path-sensitive.
    # Keep URI bytes as received and avoid slash merging.
    merge_slashes off;

    log_format blackout_main '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            '"$host" rt=$request_time uct=$upstream_connect_time '
                            'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log blackout_main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_tokens off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP staple resolvers
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Edge abuse controls by source IP.
    # Login/register rates are intentionally generous so legitimate clients
    # (which fan out to GET /login flows + POST /login during normal sign-in)
    # don't hit nginx-level limits. Synapse's rc_login / rc_registration
    # provide the real abuse controls.
    limit_req_zone $binary_remote_addr zone=matrix_login:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=matrix_register:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=matrix_media_upload:20m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=matrix_federation_ingress:20m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

    # Use 429 (Too Many Requests) instead of the default 503 so rate-limited
    # responses are semantically correct and our CORS error_page handler can
    # match them cleanly.
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/sites-enabled/*.conf;
}
