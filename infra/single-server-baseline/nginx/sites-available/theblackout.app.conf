upstream blackout_web {
    server frontend:8080;
    keepalive 64;
}

upstream blackout_api {
    server api:9000;
    keepalive 64;
}

upstream blackout_synapse {
    server synapse:8008;
    keepalive 64;
}

upstream blackout_turn_admin {
    server coturn:9641;
    keepalive 16;
}

# Coalition spatial layer tile server (MapLibre Martin).
# See infra/single-server-baseline/martin/martin.yaml and
# docs/runbooks/SPATIAL_LAYER_BASE.md.
upstream blackout_tiles {
    server martin:3000;
    keepalive 32;
}

# MatrixRTC voice/video: LiveKit SFU websocket + Element's JWT token
# bridge, exposed at /livekit/sfu and /livekit/jwt on the matrix vhost
# (per docs/deploy-fedora-tauri.md and the client's features/call/README.md).
upstream blackout_livekit {
    server livekit:7880;
    keepalive 32;
}

upstream blackout_lk_jwt {
    server lk-jwt:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name theblackout.app chat.theblackout.app matrix.theblackout.app api.theblackout.app turn.theblackout.app;

    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 200 'ok';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Black Mask chat panel framing. Used only by the two /embed locations in the
# next server block; docs/black-mask-chat-panel-and-account-link.md (step 2).
#
# The client container (`frontend`, the apps/blackout-client image) decides
# whether the panel may be framed, from BLACK_MASK_FRAME_ANCESTORS. Browsers
# enforce every Content-Security-Policy a response carries, so this proxy's own
# frame-ancestors 'none' would block the panel whatever the container allows.
# On the panel locations the proxy therefore drops its own X-Frame-Options and
# leaves frame-ancestors out of its own CSP, but only when both hold:
#   1. The raw request URI is the panel's, by the same test the client image
#      applies. nginx normalises /%65mbed/ and the like into the panel
#      locations; those keep this proxy's headers.
#   2. The container's Content-Security-Policy, as nginx reads it, is exactly
#      one frame-ancestors list in the form 40-black-mask-frame-ancestors.sh
#      writes: 'none' alone, or lower-case scheme://host[:port] origins (so no
#      'self', wildcard, path or other directive). nginx 1.23 and later join
#      repeated headers with ", ", which fails this test; older nginx reads
#      only the first header.
# The proxy then repeats that frame-ancestors list in a CSP header of its own:
# nginx also reads a header spelled Content_Security_Policy here, which a
# browser ignores, so the proxy does not rely on the container's spelling.
# In every other case (no CSP, a CSP without frame-ancestors, several CSP
# headers on nginx 1.23 or later, an upstream error, an nginx error page) the
# panel locations send exactly the security-headers.conf set.
#
# nginx computes a map value the first time a request uses it and keeps it for
# the rest of that request. Only the add_header lines in the panel locations use
# these, and they run after the upstream has answered. Using them anywhere that
# runs earlier (proxy_set_header, for one) would fix them at the fail-safe
# values. tools/ci/check-embed-proxy-framing.mjs checks the maps, the two
# locations and that both CSP strings match security-headers.conf.
map $request_uri $black_mask_panel_uri {
    default 0;
    "~^/embed(\?|$)" 1;
    "~^/embed/" 1;
}

map $upstream_http_content_security_policy $black_mask_panel_upstream_frames {
    default 0;
    "~^frame-ancestors ('none'|[a-z][a-z0-9+.-]*://[a-z0-9.-]+(:[0-9]+)?( [a-z][a-z0-9+.-]*://[a-z0-9.-]+(:[0-9]+)?)*)$" 1;
}

map $black_mask_panel_uri$black_mask_panel_upstream_frames $black_mask_panel_x_frame_options {
    default "DENY";
    11 "";
}

map $black_mask_panel_uri$black_mask_panel_upstream_frames $black_mask_panel_csp {
    default "default-src 'self'; connect-src 'self' https://api.theblackout.app https://matrix.theblackout.app wss://matrix.theblackout.app; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    11 "default-src 'self'; connect-src 'self' https://api.theblackout.app https://matrix.theblackout.app wss://matrix.theblackout.app; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'";
}

map $black_mask_panel_uri$black_mask_panel_upstream_frames $black_mask_panel_frame_ancestors {
    default "";
    11 $upstream_http_content_security_policy;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theblackout.app chat.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    include /etc/nginx/snippets/security-headers.conf;

    location = /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"m.server":"matrix.theblackout.app:443"}';
    }

    location = /.well-known/matrix/client {
        default_type application/json;
        # This block's add_header drops the server-level include; restore it.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.theblackout.app"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://matrix.theblackout.app/livekit/jwt"}]}';
    }

    # API: proxy `/v1/*` to the Blackout API instead of falling through to
    # the SPA's index.html. Without this, fetch('/v1/...') from the chat
    # origin returns HTML and the SDK throws HTTP_BAD_RESPONSE.
    location /v1/ {
        proxy_pass http://blackout_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-friendly defaults: widget alerts (and other streaming
        # endpoints) need unbuffered, long-lived upstream connections.
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
    }

    # Share-link OG previews: `/i/<token>` is server-rendered by the API so
    # social platforms unfurl the link. Must precede the `/` SPA fallback.
    location /i/ {
        proxy_pass http://blackout_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Campaign OG previews: `/c/<slug>/<campaignId>` is server-rendered by the
    # API for the same reason as `/i/`. Without this rule a shared campaign hits
    # the SPA shell and unfurls as a generic "Blackout Client" card naming
    # neither the campaign nor the coalition. Must also precede `/`.
    location /c/ {
        proxy_pass http://blackout_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Black Mask chat panel: the client image's two panel locations (/embed and
    # /embed/*; /embedded is not the panel), proxied exactly as `location /`
    # proxies. The maps above the server block decide the framing headers.
    # Declaring add_header here drops every header inherited from the server
    # block, so both locations restate the security-headers.conf set: HSTS from
    # hsts.conf, the rest below. The add_header lines carry nosemgrep because
    # semgrep's header-redefinition rule flags every add_header in a location
    # and cannot see that the set is restated.
    location = /embed {
        proxy_pass http://blackout_web;
        include /etc/nginx/snippets/hsts.conf;
        add_header X-Frame-Options $black_mask_panel_x_frame_options always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Content-Type-Options "nosniff" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), usb=(), payment=()" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy $black_mask_panel_csp always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy $black_mask_panel_frame_ancestors always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
    }

    location ^~ /embed/ {
        proxy_pass http://blackout_web;
        include /etc/nginx/snippets/hsts.conf;
        add_header X-Frame-Options $black_mask_panel_x_frame_options always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Content-Type-Options "nosniff" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), usb=(), payment=()" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy $black_mask_panel_csp always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy $black_mask_panel_frame_ancestors always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
    }

    location / {
        proxy_pass http://blackout_web;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    # A block below that sets its own add_header must include this again;
    # its add_header lines carry nosemgrep for the reason given on the
    # matrix server block.
    include /etc/nginx/snippets/hsts.conf;
    limit_conn per_ip_conn 40;

    location = /health {
        proxy_pass http://blackout_api;
    }

    # Coalition spatial layer — vector tiles via Martin.
    # Path-based to avoid a separate cert SAN at this milestone; the
    # Differentiation milestone (17 heatmap layers) may split this
    # onto tiles.theblackout.app once cert SANs are extended.
    # Tiles are immutable per (z,x,y); long Cache-Control is safe.
    location ^~ /tiles/ {
        proxy_pass http://blackout_tiles/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Layer the cache headers at the edge; Martin's per-source
        # control_cache settings still apply for source-specific
        # overrides.
        include /etc/nginx/snippets/hsts.conf;
        add_header Cache-Control "public, max-age=86400, immutable";  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Origin "*";  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
    }

    location / {
        proxy_pass http://blackout_api;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    # Every block below that sets its own add_header loses this one, so each
    # of them includes hsts.conf again (see the comment in that file). Their
    # add_header lines carry nosemgrep: semgrep's header-redefinition rule
    # flags any add_header in a location and cannot see the include.
    include /etc/nginx/snippets/hsts.conf;
    limit_conn per_ip_conn 30;

    # Rate-limit / connection-limit responses bypass Synapse, so no CORS
    # headers would be emitted and browsers surface a misleading "blocked by
    # CORS policy" error. Map error statuses to a named location that returns
    # a Matrix-shaped JSON body with CORS headers attached.
    error_page 429 = @matrix_cors_error;
    error_page 502 = @matrix_cors_error;
    error_page 503 = @matrix_cors_error;
    error_page 504 = @matrix_cors_error;

    location @matrix_cors_error {
        default_type application/json;
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Expose-Headers "Synapse-Trace-Id, Server" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        return 429 '{"errcode":"M_LIMIT_EXCEEDED","error":"Too many requests, please retry shortly"}';
    }

    # Lock down Synapse admin APIs at the edge.
    location ^~ /_synapse/admin {
        deny all;
    }

    # MatrixRTC: Element Call token bridge. Verifies the caller's Matrix
    # OpenID token and mints a scoped LiveKit access token. No CORS
    # add_header here: lk-jwt-service emits its own Access-Control-*
    # headers, and duplicating them at the edge breaks browsers (and
    # would drop the server-level HSTS header for these responses).
    location ^~ /livekit/jwt/ {
        proxy_pass http://blackout_lk_jwt/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MatrixRTC: LiveKit SFU signalling websocket. Media itself flows over
    # UDP 50100-50200 (and TCP 7881 fallback) directly to the host.
    location ^~ /livekit/sfu/ {
        proxy_pass http://blackout_livekit/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/_matrix/client/(r0|v3|v1)/login$ {
        # Don't count CORS preflight against the login limiter; Synapse has
        # rc_login as the authoritative abuse control.
        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/hsts.conf;
            add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Max-Age 86400 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Content-Length 0 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            return 204;
        }
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        limit_req zone=matrix_login burst=20 nodelay;
        proxy_pass http://blackout_synapse;
    }

    location ~ ^/_matrix/client/(r0|v3|v1)/register$ {
        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/hsts.conf;
            add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Max-Age 86400 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Content-Length 0 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            return 204;
        }
        # /register returns 401 with UIA flow info on first call — the browser
        # must be able to read that 401 cross-origin, so emit CORS headers on
        # all responses including errors via "always".
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        limit_req zone=matrix_register burst=10 nodelay;
        proxy_pass http://blackout_synapse;
    }

    location ~ ^/_matrix/media/(r0|v3|v1)/upload {
        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/hsts.conf;
            add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Max-Age 86400 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Content-Length 0 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            return 204;
        }
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        limit_req zone=matrix_media_upload burst=20 nodelay;
        proxy_pass http://blackout_synapse;
    }

    # Federation and server-to-server: no CORS (not browser-facing).
    location ~ ^/_matrix/federation/ {
        limit_req zone=matrix_federation_ingress burst=120 nodelay;
        proxy_pass http://blackout_synapse;
    }

    location ~ ^/_matrix/key/v2/ {
        limit_req zone=matrix_federation_ingress burst=120 nodelay;
        proxy_pass http://blackout_synapse;
    }

    # Catch-all for remaining browser-facing Matrix client and Synapse client
    # endpoints (UIA continuation, account, sync, etc). Must include CORS so
    # responses — including 401 UIA challenges — are readable cross-origin.
    location ~ ^(/_matrix/(client|media|identity|static)|/_synapse/client) {
        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/hsts.conf;
            add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Access-Control-Max-Age 86400 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Content-Length 0 always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            return 204;
        }
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Date, If-Match, If-None-Match" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Access-Control-Expose-Headers "Synapse-Trace-Id, Server" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_pass http://blackout_synapse;
    }

    location = /.well-known/matrix/server {
        default_type application/json;
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        return 200 '{"m.server":"matrix.theblackout.app:443"}';
    }

    location = /.well-known/matrix/client {
        default_type application/json;
        include /etc/nginx/snippets/hsts.conf;
        add_header Access-Control-Allow-Origin "*" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        return 200 '{"m.homeserver":{"base_url":"https://matrix.theblackout.app"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://matrix.theblackout.app/livekit/jwt"}]}';
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turn.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /healthz {
        proxy_pass http://blackout_turn_admin/healthz;
    }

    location / {
        return 404;
    }
}
