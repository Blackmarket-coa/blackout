upstream blackout_web {
    server frontend:8080;
    keepalive 64;
}

upstream blackout_api {
    server api:9000;
    keepalive 64;
}

upstream blackout_synapse {
    server synapse:8008;
    keepalive 64;
}

upstream blackout_turn_admin {
    server coturn:9641;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name theblackout.app chat.theblackout.app matrix.theblackout.app api.theblackout.app turn.theblackout.app;

    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 200 'ok';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theblackout.app chat.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    include /etc/nginx/snippets/security-headers.conf;

    location = /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"m.server":"matrix.theblackout.app:443"}';
    }

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.theblackout.app"}}';
    }

    location / {
        proxy_pass http://blackout_web;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    limit_conn per_ip_conn 40;

    location = /health {
        proxy_pass http://blackout_api;
    }

    location / {
        proxy_pass http://blackout_api;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    limit_conn per_ip_conn 30;

    # Lock down Synapse admin APIs at the edge.
    location ^~ /_synapse/admin {
        deny all;
    }

    location ~ ^/_matrix/client/(r0|v3|v1)/login$ {
        limit_req zone=matrix_login burst=10 nodelay;
        proxy_pass http://blackout_synapse;
    }

    location ~ ^/_matrix/client/(r0|v3|v1)/register$ {
        limit_req zone=matrix_register burst=5 nodelay;
        proxy_pass http://blackout_synapse;
    }

    location ~ ^/_matrix/media/(r0|v3|v1)/upload {
        limit_req zone=matrix_media_upload burst=20 nodelay;
        proxy_pass http://blackout_synapse;
    }

    location ~ ^/_matrix/federation/ {
        limit_req zone=matrix_federation_ingress burst=120 nodelay;
        proxy_pass http://blackout_synapse;
    }

    location ~ ^/_matrix/key/v2/ {
        limit_req zone=matrix_federation_ingress burst=120 nodelay;
        proxy_pass http://blackout_synapse;
    }

    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://blackout_synapse;
    }

    location = /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"m.server":"matrix.theblackout.app:443"}';
    }

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.theblackout.app"}}';
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turn.theblackout.app;

    ssl_certificate /etc/letsencrypt/live/theblackout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theblackout.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theblackout.app/chain.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /healthz {
        proxy_pass http://blackout_turn_admin/healthz;
    }

    location / {
        return 404;
    }
}
