add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), usb=(), payment=()" always;

# Adjust CSP to match your frontend build/runtime requirements.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.theblackout.app https://matrix.theblackout.app wss://matrix.theblackout.app; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
