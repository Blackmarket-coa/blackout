version: '3.9'

name: blackout-prod

x-common-logging: &common-logging
    logging:
        driver: json-file
        options:
            max-size: '10m'
            max-file: '5'

services:
    reverse-proxy:
        image: nginx:1.27-alpine
        container_name: blackout-reverse-proxy
        restart: unless-stopped
        depends_on:
            frontend:
                condition: service_healthy
            api:
                condition: service_healthy
            synapse:
                condition: service_healthy
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/sites-available/theblackout.app.conf:/etc/nginx/sites-enabled/theblackout.app.conf:ro
            - ./nginx/snippets/proxy-common.conf:/etc/nginx/snippets/proxy-common.conf:ro
            - ./nginx/snippets/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
            - letsencrypt:/etc/letsencrypt
            - certbot-webroot:/var/www/certbot
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/nginx-health || exit 1']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 15s
        networks:
            - edge
            - app
        security_opt:
            - no-new-privileges:true
        read_only: true
        tmpfs:
            - /var/cache/nginx
            - /var/run
        <<: *common-logging

    certbot:
        image: certbot/certbot:v2.11.0
        container_name: blackout-certbot
        profiles: ['manual']
        restart: 'no'
        command: ['certonly', '--webroot', '-w', '/var/www/certbot']
        volumes:
            - letsencrypt:/etc/letsencrypt
            - certbot-webroot:/var/www/certbot
        networks:
            - edge
        <<: *common-logging

    frontend:
        image: ghcr.io/blackout/frontend:${FRONTEND_TAG}
        container_name: blackout-frontend
        restart: unless-stopped
        expose:
            - '8080'
        environment:
            - NODE_ENV=production
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz || exit 1']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks:
            - app
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

    api:
        image: ghcr.io/blackout/api:${API_TAG}
        container_name: blackout-api
        restart: unless-stopped
        expose:
            - '9000'
        environment:
            - NODE_ENV=production
            - PORT=9000
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
            # Public origin used to build invite URLs, OAuth callbacks, etc.
            # Must be the externally-reachable HTTPS origin, not the internal
            # container URL — otherwise invite links point at localhost.
            - PUBLIC_APP_URL=https://${PRIMARY_DOMAIN}
            # Origins permitted to call the API from a browser. The chat
            # subdomain proxies /v1/* to this service (see nginx config), so
            # both hosts need to be whitelisted.
            - CORS_ALLOWED_ORIGINS=https://${PRIMARY_DOMAIN},https://chat.${PRIMARY_DOMAIN}
            - JWT_SECRET_PRIMARY=${JWT_SECRET_PRIMARY}
            # Internal Synapse listener (admin + client APIs). Both env names
            # are accepted by matrix-client.ts; keep both to stay tolerant of
            # the legacy *_URL spelling.
            - MATRIX_HOMESERVER=http://synapse:8008
            - MATRIX_HOMESERVER_URL=http://synapse:8008
            # Server-name suffix used when constructing MXIDs against the
            # admin API. Must equal SYNAPSE_SERVER_NAME below.
            - MATRIX_HOMESERVER_DOMAIN=${PRIMARY_DOMAIN}
            - MATRIX_BOT_TOKEN=${MATRIX_BOT_TOKEN}
            # Prometheus scrape token. The API returns 503 on /metrics when
            # this is unset in production.
            - INTERNAL_METRICS_TOKEN=${INTERNAL_METRICS_TOKEN}
            # Runtime store mode. `postgres` makes the API persist all state to the
            # Postgres service above via the write-through store: it runs migrations
            # on boot, hydrates an in-memory read mirror, and write-throughs every
            # mutation. SAFE here because this baseline runs a SINGLE api container —
            # the mirror is per-process, so multi-replica deployments (Helm/k8s) must
            # NOT use this mode until cross-replica invalidation exists.
            - BLACKOUT_DB_MODE=postgres
            # Legacy file-store path. Unused in postgres mode (kept for the named
            # volume + an easy rollback to file mode by removing BLACKOUT_DB_MODE).
            - BLACKOUT_DB_FILE=/var/lib/blackout/store.json
            # Internal image-perturbation sidecar (anti–facial-recognition). When
            # unset the client falls back to its best-effort client-side transform.
            - PERTURBATION_SERVICE_URL=http://perturbation:8000
            # Analytics warehouse ingest (docs/runbooks/ANALYTICS_WAREHOUSE.md).
            # POST /v1/telemetry/events writes to analytics_raw.events over the
            # `data` network. Unset CLICKHOUSE_URL = ingest becomes a silent no-op;
            # the warehouse is never required for user-facing uptime.
            - CLICKHOUSE_URL=http://clickhouse:8123
            - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
            - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
        volumes:
            - blackout-api-data:/var/lib/blackout
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                - 'CMD'
                - 'python'
                - '-c'
                - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=4).status == 200 else 1)"
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - app
            - data
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

    synapse:
        image: matrixdotorg/synapse:v1.130.0
        container_name: blackout-synapse
        restart: unless-stopped
        user: '991:991'
        expose:
            - '8008'
            - '9101' # /_synapse/metrics — internal-only Prometheus scrape
        environment:
            - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
            - SYNAPSE_SERVER_NAME=theblackout.app
            - SYNAPSE_REPORT_STATS=no
        volumes:
            - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
            - synapse-data:/data
            - synapse-media:/media
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -qO- http://127.0.0.1:8008/health || wget -qO- http://127.0.0.1:8008/_matrix/client/versions || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 8
            start_period: 45s
        networks:
            - app
            - data
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

    postgres:
        # postgis/postgis is the upstream Postgres image with the PostGIS
        # extension pre-installed. Binary-compatible with vanilla Postgres
        # for non-spatial consumers (Synapse, @blackout/api), so the swap
        # is safe; the only difference is that `CREATE EXTENSION postgis`
        # is now possible inside the spatial database created by
        # postgres/initdb/01-spatial-database.sql. See
        # docs/runbooks/SPATIAL_LAYER_BASE.md for the existing-volume
        # bootstrap path (initdb scripts only run on a fresh data dir).
        image: postgis/postgis:16-3.4-alpine
        container_name: blackout-postgres
        restart: unless-stopped
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        # Tuning lives in postgres/postgresql.conf; keeping it as a config file
        # rather than -c flags so re-tuning is a one-file edit (and so the
        # rationale comments stay attached to the values).
        command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./backup:/backup:rw
            - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
            - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - data
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

    redis:
        image: redis:7.2-alpine
        container_name: blackout-redis
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD} ping | grep PONG']
            interval: 10s
            timeout: 3s
            retries: 10
            start_period: 10s
        networks:
            - data
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

    martin:
        # MapLibre Martin — OSS PostGIS + PMTiles tile server.
        # Upstream: https://github.com/maplibre/martin (Apache-2.0 / MIT).
        # Serves vector tiles from:
        #   - The PostGIS `spatial` database (Coalition working tables).
        #   - PMTiles archives mounted at ./martin/pmtiles (basemap).
        # Modifications: none — adoption is config-only via martin.yaml.
        # See docs/runbooks/SPATIAL_LAYER_BASE.md for bootstrap, basemap
        # download, and smoke test.
        image: ghcr.io/maplibre/martin:v0.14.2
        container_name: blackout-martin
        restart: unless-stopped
        expose:
            - '3000'
        command: ['--config', '/etc/martin/martin.yaml']
        environment:
            # Martin reads the connection from the env var when the config
            # references {{DATABASE_URL}}; keeps the password out of the
            # checked-in martin.yaml.
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/spatial
        volumes:
            - ./martin/martin.yaml:/etc/martin/martin.yaml:ro
            - ./martin/pmtiles:/var/lib/martin/pmtiles:ro
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - data
            - app
        security_opt:
            - no-new-privileges:true
        read_only: true
        <<: *common-logging

    perturbation:
        # Blackout image-perturbation sidecar (anti–facial-recognition).
        # Source: ../../services/perturbation. Internal-only (app network, no edge
        # exposure); only the API reaches it. CPU-only scaffold by default — see
        # services/perturbation/README.md for the Fawkes/Glaze (GPU) upgrade.
        build:
            context: ../../services/perturbation
        container_name: blackout-perturbation
        restart: unless-stopped
        expose:
            - '8000'
        healthcheck:
            test:
                - 'CMD'
                - 'python'
                - '-c'
                - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks:
            - app
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

    postgres-exporter:
        # Exposes Postgres health metrics (autovacuum lag, connection pool,
        # buffer cache hit ratio, locks, replication state) on port 9187.
        # Consumed by the `postgres` scrape job in
        # deploy/docker/production/monitoring/prometheus/prometheus.yml.example
        # and the Postgres panels in
        # docs/operations/dashboards/synapse_capacity_dashboard.json.
        #
        # Connects as POSTGRES_USER (the application superuser). The
        # upgrade path is a dedicated read-only user with the pg_monitor
        # role:
        #   CREATE USER postgres_exporter WITH PASSWORD '...';
        #   GRANT pg_monitor TO postgres_exporter;
        # then point DATA_SOURCE_NAME at that user. Tracked in
        # infra/single-server-baseline/RUNBOOK.md §13.
        image: prometheuscommunity/postgres-exporter:v0.15.0
        container_name: blackout-postgres-exporter
        restart: unless-stopped
        expose:
            - '9187'
        environment:
            - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
            # Enable optional collectors that surface autovacuum lag and
            # statement-level activity. pg_stat_statements collector requires
            # the extension to be preloaded — see postgres/postgresql.conf.
            - PG_EXPORTER_AUTO_DISCOVER_DATABASES=true
            - PG_EXPORTER_INCLUDE_DATABASES=${POSTGRES_DB}
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9187/ >/dev/null || exit 1']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks:
            - data
            - app
        security_opt:
            - no-new-privileges:true
        read_only: true
        <<: *common-logging

    clickhouse:
        # ClickHouse — OSS columnar OLAP store, Apache-2.0.
        # Upstream: https://github.com/ClickHouse/ClickHouse.
        # Foundation milestone analytics warehouse per AOG §9.3.
        # See docs/runbooks/ANALYTICS_WAREHOUSE.md for bootstrap +
        # existing-volume migration; RUNBOOK.md §18 for operator notes.
        image: clickhouse/clickhouse-server:24.3-alpine
        container_name: blackout-clickhouse
        restart: unless-stopped
        expose:
            - '8123'
            - '9000'
        environment:
            - CLICKHOUSE_DB=analytics
            - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
            - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
            - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
        volumes:
            - clickhouse-data:/var/lib/clickhouse
            - clickhouse-logs:/var/log/clickhouse-server
            - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
            - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping >/dev/null || exit 1']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - data
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

    cube:
        # Cube — OSS semantic / metrics layer, Apache-2.0.
        # Upstream: https://github.com/cube-js/cube.
        # Sits between ClickHouse (storage) and Metabase (BI). Schema
        # files live in ./cube/schema/ and are bind-mounted; new models
        # require a cube restart unless dev mode is enabled.
        image: cubejs/cube:v0.36.0
        container_name: blackout-cube
        restart: unless-stopped
        expose:
            - '4000'
        environment:
            - CUBEJS_DB_TYPE=clickhouse
            - CUBEJS_DB_HOST=clickhouse
            - CUBEJS_DB_PORT=8123
            - CUBEJS_DB_USER=${CLICKHOUSE_USER:-default}
            - CUBEJS_DB_PASS=${CLICKHOUSE_PASSWORD}
            - CUBEJS_DB_NAME=analytics_raw
            - CUBEJS_API_SECRET=${CUBE_API_SECRET}
            - CUBEJS_DEV_MODE=false
            - CUBEJS_TELEMETRY=false
        volumes:
            - ./cube/cube.js:/cube/conf/cube.js:ro
            - ./cube/schema:/cube/conf/schema:ro
            - cube-data:/cube/data
        depends_on:
            clickhouse:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/readyz >/dev/null || exit 1']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 45s
        networks:
            - data
            - app
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

    metabase:
        # Metabase — OSS BI / dashboarding, AGPL-3.0 (Community Edition).
        # Upstream: https://github.com/metabase/metabase.
        # App data persists in the `metabase` Postgres database created
        # by postgres/initdb/02-metabase-database.sql. Internal-only at
        # the Foundation milestone — accessed via SSH tunnel by the
        # maintainer; the public nginx route is deferred until coalition
        # stewards actually start using it (Differentiation milestone).
        image: metabase/metabase:v0.50.0
        container_name: blackout-metabase
        restart: unless-stopped
        expose:
            - '3001'
        environment:
            - MB_JETTY_PORT=3001
            - MB_DB_TYPE=postgres
            - MB_DB_HOST=postgres
            - MB_DB_PORT=5432
            - MB_DB_DBNAME=metabase
            - MB_DB_USER=${POSTGRES_USER}
            - MB_DB_PASS=${POSTGRES_PASSWORD}
            # Telemetry off by default; revisit for usage analytics if needed.
            - MB_ANON_TRACKING_ENABLED=false
            - MB_CHECK_FOR_UPDATES=false
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 90s
        networks:
            - data
            - app
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

    coturn:
        image: coturn/coturn:4.6.3-r0
        container_name: blackout-coturn
        restart: unless-stopped
        command: ['-c', '/etc/coturn/turnserver.conf', '-n']
        ports:
            - '3478:3478/tcp'
            - '3478:3478/udp'
            - '5349:5349/tcp'
            - '49160-49200:49160-49200/udp'
        volumes:
            - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
            - coturn-data:/var/lib/coturn
        healthcheck:
            test: ['CMD-SHELL', 'pidof turnserver >/dev/null || exit 1']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 15s
        networks:
            - edge
            - app
        security_opt:
            - no-new-privileges:true
        <<: *common-logging

networks:
    edge:
        name: blackout-edge
    app:
        name: blackout-app
        internal: true
    data:
        name: blackout-data
        internal: true

volumes:
    letsencrypt:
        name: blackout-letsencrypt
    certbot-webroot:
        name: blackout-certbot-webroot
    postgres-data:
        name: blackout-postgres-data
    redis-data:
        name: blackout-redis-data
    synapse-data:
        name: blackout-synapse-data
    synapse-media:
        name: blackout-synapse-media
    coturn-data:
        name: blackout-coturn-data
    clickhouse-data:
        name: blackout-clickhouse-data
    clickhouse-logs:
        name: blackout-clickhouse-logs
    cube-data:
        name: blackout-cube-data
    blackout-api-data:
        name: blackout-api-data
