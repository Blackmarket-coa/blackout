version: "3.9"

name: blackout-prod

x-common-logging: &common-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: blackout-reverse-proxy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      synapse:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available/theblackout.app.conf:/etc/nginx/sites-enabled/theblackout.app.conf:ro
      - ./nginx/snippets/proxy-common.conf:/etc/nginx/snippets/proxy-common.conf:ro
      - ./nginx/snippets/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge
      - app
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    <<: *common-logging

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: blackout-certbot
    restart: unless-stopped
    command: >-
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook 'nginx -s reload'; sleep 12h; done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - edge
    <<: *common-logging

  frontend:
    image: ghcr.io/blackout/frontend:${FRONTEND_TAG}
    container_name: blackout-frontend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    <<: *common-logging

  api:
    image: ghcr.io/blackout/api:${API_TAG}
    container_name: blackout-api
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      - NODE_ENV=production
      - PORT=9000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MATRIX_HOMESERVER_URL=http://synapse:8008
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app
      - data
    security_opt:
      - no-new-privileges:true
    <<: *common-logging

  synapse:
    image: matrixdotorg/synapse:v1.130.0
    container_name: blackout-synapse
    restart: unless-stopped
    user: "991:991"
    expose:
      - "8008"
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
      - SYNAPSE_SERVER_NAME=matrix.theblackout.app
      - SYNAPSE_REPORT_STATS=no
    volumes:
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - synapse-data:/data
      - synapse-media:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8008/health || wget -qO- http://127.0.0.1:8008/_matrix/client/versions || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - app
      - data
    security_opt:
      - no-new-privileges:true
    <<: *common-logging

  postgres:
    image: postgres:16-alpine
    container_name: blackout-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=512MB
      - -c
      - wal_level=replica
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backup:/backup:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    <<: *common-logging

  redis:
    image: redis:7.2-alpine
    container_name: blackout-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    <<: *common-logging

  coturn:
    image: coturn/coturn:4.6.3-r0
    container_name: blackout-coturn
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf", "-n"]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn-data:/var/lib/coturn
    healthcheck:
      test: ["CMD-SHELL", "pidof turnserver >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge
      - app
    security_opt:
      - no-new-privileges:true
    <<: *common-logging

networks:
  edge:
    name: blackout-edge
  app:
    name: blackout-app
    internal: true
  data:
    name: blackout-data
    internal: true

volumes:
  letsencrypt:
    name: blackout-letsencrypt
  certbot-webroot:
    name: blackout-certbot-webroot
  postgres-data:
    name: blackout-postgres-data
  redis-data:
    name: blackout-redis-data
  synapse-data:
    name: blackout-synapse-data
  synapse-media:
    name: blackout-synapse-media
  coturn-data:
    name: blackout-coturn-data
