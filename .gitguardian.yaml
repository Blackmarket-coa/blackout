# GitGuardian / ggshield configuration.
#
# Test fixtures and runbook examples need credential-shaped strings that
# are demonstrably fake but high-entropy enough to satisfy production
# strength checks. Path-allowlisting them keeps GitGuardian from flagging
# every audit run while preserving scanning of real source code.
#
# Schema note: ggshield v2 config uses `secret.ignored_paths` (nested),
# NOT the top-level `paths-ignore` / `paths_ignore` from v1. The latter
# is silently ignored under v2, which leaves the entire allowlist
# inert — verified locally via `ggshield --version 1.50.4` against this
# file. See https://docs.gitguardian.com/ggshield-docs/reference/configuration.

version: 2

# Belt-and-braces: declare the allowlist under BOTH the v2 nested
# `secret.ignored_paths` key AND the v1-compatible top-level
# `paths-ignore` key. The local ggshield 1.50.4 honors the nested form;
# the GitGuardian GitHub App may still expect the legacy top-level form
# (it has fast-failed even with the v2 schema in place). Listing the
# same paths under both keys is a no-op for whichever parser is in use
# and removes the schema mismatch as a possible cause.

paths-ignore:
  - "packages/api/test/**/*.test.ts"
  - "packages/api/test/**/*.integration.test.ts"
  - "apps/blackout-client/tests/**/*.ts"
  - "apps/blackout-client/tests/**/*.tsx"
  - "apps/blackout-client/src/**/*.test.ts"
  - "apps/blackout-client/src/**/*.test.tsx"
  - "load/k6/**"
  - "docs/operations/runbooks/*.md"
  - "docs/audits/*.md"
  - "docs/operations/evidence/*.md"
  - "tools/ci/**"
  - ".github/workflows/load.yml"
  - "pnpm-lock.yaml"
  - "**/pnpm-lock.yaml"
  - "package-lock.json"
  - "**/package-lock.json"
  # gitleaks ignore file — contains commit/fingerprint entries and rule
  # names (generic-api-key, generic-password, etc.) that look like secrets
  # to a generic detector but are the scanner's own allowlist format.
  - ".gitleaksignore"
  # Contributor example compose files — env var NAME references only
  # (${VAR:?...}). No actual credentials are embedded. The keywords
  # PASSWORD, PGPASSWORD, REDIS_PASSWORD are docker-compose key names.
  - "apps/blackout-server/contrib/**"

secret:
  ignored_paths:
    # Integration test fixtures — secrets here are scoped to the in-memory
    # api process and the strength validator. None of them ever land in a
    # secret store or CI environment variable.
    - "packages/api/test/**/*.test.ts"
    - "packages/api/test/**/*.integration.test.ts"
    # Client-side test fixtures — same trust class as the api tests above.
    - "apps/blackout-client/tests/**/*.ts"
    - "apps/blackout-client/tests/**/*.tsx"
    - "apps/blackout-client/src/**/*.test.ts"
    - "apps/blackout-client/src/**/*.test.tsx"
    # k6 load scripts run against ephemeral CI services with synthetic
    # credentials minted at startup. Ignored to avoid noise on bearer-style
    # placeholders.
    - "load/k6/**"
    # Operational runbooks intentionally show rotation key examples.
    - "docs/operations/runbooks/*.md"
    - "docs/audits/*.md"
    # Evidence files record the exact commands run in baseline replays
    # (including env var NAMES like MAIL_RESEND_API_KEY); the values are
    # never embedded.
    - "docs/operations/evidence/*.md"
    # CI tooling references env var names for production secrets but never
    # embeds values.
    - "tools/ci/**"
    # Workflow file embeds a synthetic JWT_SECRET_PRIMARY for the load
    # job's Postgres + Redis service container; the value is a literal
    # placeholder.
    - ".github/workflows/load.yml"
    # pnpm-lock.yaml integrity hashes (sha512-...==) look identical to
    # base64-encoded secrets to a generic detector. They are the
    # SRI digests of the corresponding npm tarballs, auto-generated by
    # `pnpm install`, never user-supplied. Lockfiles never contain
    # real secrets in this codebase.
    - "pnpm-lock.yaml"
    - "**/pnpm-lock.yaml"
    - "package-lock.json"
    - "**/package-lock.json"
    # gitleaks ignore file — same rationale as the top-level paths-ignore entry.
    - ".gitleaksignore"
    # Contributor example compose files — same rationale as the top-level entry.
    - "apps/blackout-server/contrib/**"
