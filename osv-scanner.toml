# OSV scanner allowlist — accepted-risk vulnerabilities only.
#
# Each [[IgnoredVulns]] block silences ONE advisory ID. `ignoreUntil`
# is the hard deadline by which the underlying upgrade must happen;
# after that date the scanner reports the finding again. This forces
# accepted-risk debt to be paid down rather than ignored indefinitely.
#
# RULE: only add entries here when you've confirmed the advisory does
# not apply to our usage and there's a concrete plan to upgrade.
# Otherwise the right fix is to bump the dependency now.
#
# Every other previously-accepted advisory (hono JSX/bodyLimit, fast-uri,
# @babel/plugin-transform-modules-systemjs, vitest, postcss, tar) has been
# resolved by bumping the underlying dependency via pnpm.overrides.

# react-router RSC-mode CSRF bypass. Does NOT apply to Blackout: the client is
# a Vite SPA that imports react-router in library mode only (no RSC / framework
# mode — verified: zero `@react-router/server` or RSC imports across src). The
# fix is react-router 8, whose entire line requires React >=19.2.7, so adopting
# it is a React 18->19 migration (folds still peers React 17), tracked as a
# separate epic. ignoreUntil forces that decision to be revisited.
[[IgnoredVulns]]
id = "GHSA-qwww-vcr4-c8h2"
ignoreUntil = 2026-10-31
reason = "RSC-mode-only advisory; client uses react-router in library mode. Fix requires React 19 migration (tracked separately)."

# image-size infinite-loop DoS, two advisories of the same class: crafted
# JXL/HEIF box-types (GHSA-5p2g-fcmc-qvqq) and a zero-length ICNS entry
# (GHSA-w3rx-r6r6-pgpr) each hang the parser and block the event loop.
#
# There is nothing to bump to: OSV lists EVERY version through 2.0.2 as
# affected, including the whole 2.x line, and neither advisory names a fixed
# version. This is the one case the "bump it instead" rule cannot cover.
#
# Does not apply to our usage. image-size is reached only through
# metro -> @react-native/community-cli-plugin, i.e. React Native's build-time
# bundler; it never ships in a runtime bundle, on device or on the web. The
# images it parses are the asset files committed in this repo at bundle time,
# not remote or user-supplied input, so the "remote attacker supplies a crafted
# buffer" precondition has no path here.
#
# ignoreUntil forces a re-check for an upstream fix (or a metro release that
# drops the dependency) rather than silencing this indefinitely.
[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2026-11-30
reason = "No fixed version exists (all versions <=2.0.2 affected). Build-time only: metro's asset pipeline parses repo-committed images, never remote input."

[[IgnoredVulns]]
id = "GHSA-w3rx-r6r6-pgpr"
ignoreUntil = 2026-11-30
reason = "No fixed version exists (all versions <=2.0.2 affected). Build-time only: metro's asset pipeline parses repo-committed images, never remote input."

# The brace-expansion ReDoS ignore (GHSA-mh99-v99m-4gvg) used to sit here. The
# `pnpm.overrides` pins that resolved it — 1.1.18 / 2.1.4 / 5.0.9, all at or
# above the per-line fixes and the GHSA-rgw5-rvv9-x895 bypass follow-ups — mean
# the scanner no longer reports it, so the entry became an unused ignore it
# warned about on every run. Removed rather than left dead: if the tree ever
# regresses below those pins the scan should fail loudly, not stay silenced.
