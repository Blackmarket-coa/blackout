# OSV scanner allowlist — accepted-risk vulnerabilities only.
#
# Each [[IgnoredVulns]] block silences ONE advisory ID. `ignoreUntil`
# is the hard deadline by which the underlying upgrade must happen;
# after that date the scanner reports the finding again. This forces
# accepted-risk debt to be paid down rather than ignored indefinitely.
#
# RULE: only add entries here when you've confirmed the advisory does
# not apply to our usage and there's a concrete plan to upgrade.
# Otherwise the right fix is to bump the dependency now.

# Hono pinned at 4.12.14 across the api workspace. Both advisories
# below are fixed upstream in 4.13.0+; bumping is tracked separately
# from this PR's diff (which is the multi-platform-extensions compat
# layer, not a Hono-API audit).

[[IgnoredVulns]]
id = "GHSA-69xw-7hcm-h432"
ignoreUntil = 2026-08-31
reason = """
Hono JSX renderer: unvalidated JSX tag names may allow HTML injection.
Blackout's API does NOT use Hono's JSX renderer — every Hono route
returns JSON via c.json() or text via c.text(). The vulnerable code
path is unreachable in this codebase. Tracked for Hono >=4.13.0 bump
in a follow-up PR.
"""

[[IgnoredVulns]]
id = "GHSA-9vqf-7f2p-gf9v"
ignoreUntil = 2026-08-31
reason = """
Hono bodyLimit() can be bypassed for chunked / unknown-length requests.
Blackout's edge-layer rate limiter + nginx ingress cap request body
sizes upstream of Hono, so the bypass cannot grow a request past the
ingress cap. Hono's bodyLimit is defense-in-depth, not the primary
limit. Tracked for Hono >=4.13.0 bump in a follow-up PR.
"""

# vite-plugin-pwa@0.20.5 (devDep of @blackout/client) → workbox-build@7.4.0 →
# ajv@8.18.0 → fast-uri@3.1.0. Build-time only; the PWA service worker is
# generated at compile time from a fixed input, and fast-uri is never loaded
# at runtime. Same disposition recorded in
# docs/operations/UPSTREAM_ADVISORIES.md. Cleared transitively when
# vite-plugin-pwa is bumped to a release that pulls in a workbox-build with
# patched ajv.

[[IgnoredVulns]]
id = "GHSA-v39h-62p7-jpjc"
ignoreUntil = 2026-08-31
reason = """
fast-uri host confusion via percent-encoded authority delimiters. Path is
vite-plugin-pwa → workbox-build → ajv → fast-uri, all devDependencies.
fast-uri only executes at PWA build time when workbox compiles the service
worker; it never reaches a request-handling path in the production bundle.
Tracked for vite-plugin-pwa major bump in a follow-up PR.
"""

# Second fast-uri advisory on the same vite-plugin-pwa devDep chain
# (fixed in fast-uri 3.1.1). Same build-time-only disposition.

[[IgnoredVulns]]
id = "GHSA-q3j6-qgpj-74h6"
ignoreUntil = 2026-08-31
reason = """
fast-uri ReDoS via crafted authority URI. Path is vite-plugin-pwa →
workbox-build → ajv → fast-uri, all devDependencies. fast-uri only runs
at PWA build time; it never sees an attacker-controlled URI at runtime.
Tracked for vite-plugin-pwa major bump in a follow-up PR.
"""

# Same devDep chain as fast-uri above: vite-plugin-pwa → workbox-build →
# @babel/preset-env → @babel/plugin-transform-modules-systemjs. Build-time
# transformer; not in the runtime bundle.

[[IgnoredVulns]]
id = "GHSA-fv7c-fp4j-7gwp"
ignoreUntil = 2026-08-31
reason = """
@babel/plugin-transform-modules-systemjs generates arbitrary code when
compiling malicious input. Path is vite-plugin-pwa → workbox-build →
@babel/preset-env → @babel/plugin-transform-modules-systemjs, all
devDependencies. The transformer only runs at build time on first-party
source we control; an attacker would need to land malicious source in the
repo to exploit it, by which point they have a much larger attack surface.
Tracked for vite-plugin-pwa major bump in a follow-up PR.
"""

# vitest (2.1.9 + 3.2.4 across the workspace) — test-runner devDependency,
# never present in any production bundle or runtime. Fixed in vitest 4.1.0,
# a breaking major bump (config/coverage API changes) that warrants its own
# migration PR rather than a lockfile patch here.

[[IgnoredVulns]]
id = "GHSA-5xrq-8626-4rwp"
ignoreUntil = 2026-08-31
reason = """
Vitest API / browser server can be reached by a malicious origin to execute
code. Vitest is a devDependency test runner: it is never bundled into or
loaded by the production app, and CI runs it headless against first-party
tests with no externally-reachable API/browser server. The exploit vector (a
remote page connecting to a developer's running Vitest server) does not exist
in CI or production. Fixed in vitest >=4.1.0; tracked for a dedicated vitest 4
upgrade PR (breaking config/coverage changes) rather than this PR's diff.
"""
