# OSV scanner allowlist — accepted-risk vulnerabilities only.
#
# Each [[IgnoredVulns]] block silences ONE advisory ID. `ignoreUntil`
# is the hard deadline by which the underlying upgrade must happen;
# after that date the scanner reports the finding again. This forces
# accepted-risk debt to be paid down rather than ignored indefinitely.
#
# RULE: only add entries here when you've confirmed the advisory does
# not apply to our usage and there's a concrete plan to upgrade.
# Otherwise the right fix is to bump the dependency now.
#
# Every other previously-accepted advisory (hono JSX/bodyLimit, fast-uri,
# @babel/plugin-transform-modules-systemjs, vitest, postcss, tar) has been
# resolved by bumping the underlying dependency via pnpm.overrides. The
# react-router RSC CSRF advisory (GHSA-qwww-vcr4-c8h2) was resolved on
# 2026-10-30 by moving the client to react-router 7.18.2. The glob
# AbortSignal advisory (GHSA-3g3m-2fjr-6pw4) was resolved on 2026-10-31 by
# the pnpm.overrides pin "glob@>=9 <14.0.3": "^14.0.3", which also took
# minimatch 10.2.5 out of the tree. With "filelist@1>minimatch": "^11.0.3",
# one minimatch version is left in that advisory's range
# (GHSA-g3hv-75wg-m249), triaged in its entry below.

# image-size infinite-loop DoS, two advisories of the same class: crafted
# JXL/HEIF box-types (GHSA-5p2g-fcmc-qvqq) and a zero-length ICNS entry
# (GHSA-w3rx-r6r6-pgpr) each hang the parser and block the event loop.
#
# There is nothing to bump to: OSV lists EVERY version through 2.0.2 as
# affected, including the whole 2.x line, and neither advisory names a fixed
# version. This is the one case the "bump it instead" rule cannot cover.
#
# Does not apply to our usage. image-size is reached only through
# metro -> @react-native/community-cli-plugin, i.e. React Native's build-time
# bundler; it never ships in a runtime bundle, on device or on the web. The
# images it parses are the asset files committed in this repo at bundle time,
# not remote or user-supplied input, so the "remote attacker supplies a crafted
# buffer" precondition has no path here.
#
# ignoreUntil forces a re-check for an upstream fix (or a metro release that
# drops the dependency) rather than silencing this indefinitely.
[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2026-11-30
reason = "No fixed version exists (all versions <=2.0.2 affected). Build-time only: metro's asset pipeline parses repo-committed images, never remote input."

[[IgnoredVulns]]
id = "GHSA-w3rx-r6r6-pgpr"
ignoreUntil = 2026-11-30
reason = "No fixed version exists (all versions <=2.0.2 affected). Build-time only: metro's asset pipeline parses repo-committed images, never remote input."

# deepmerge prototype poisoning (GHSA-gcqx-w48m-w2h4 / CVE-2026-93753): when a
# source object has an own `__proto__` key (as JSON.parse produces) and the
# value it is merged onto is a primitive, null or a null-prototype object,
# mergeObject() sets the prototype of the merged object at that position: a
# nested value of the result, or the result itself for a null-prototype
# target. The top level of deepmerge.all(), which starts from {}, is not
# poisoned. Object.prototype itself is not touched.
#
# There is nothing to bump to: OSV lists 4.2.0 through 4.3.1, the latest
# release, as affected, and names no fixed version.
#
# Does not apply to our usage. deepmerge runs only at build time, on
# repo-authored objects and dependency constants, never attacker input:
#   - @vanilla-extract/css 1.20.1 (apps/blackout-client, packages/ui, and the
#     vanilla-extract vite plugin): `style([...])` merges the style objects of
#     our own `.css.ts(x)` files, built from repo code and constants such as
#     folds' `config` and `color`, while vite evaluates them in Node. A nested
#     key of a merged rule could be poisoned, but only by those objects, and no
#     tracked `.css.ts(x)` file contains `__proto__`, JSON.parse or fetch. No
#     deepmerge code ships in the client bundle (checked against a production
#     build's JS and its source maps).
#   - workbox-build 7.4.0 -> @rollup/plugin-node-resolve 15.3.1, which merges
#     only its own constant defaults.
# Not mirrored in .trivyignore or pnpm.auditConfig: GitHub rates it Low, so
# Trivy's HIGH/CRITICAL gate and `pnpm audit --audit-level high` pass on it.
#
# Plan: @vanilla-extract/css 1.21.3 (2026-10-08) replaced deepmerge with
# deepmerge-ts ^8.0.2, so moving to it removes the first path but brings in a
# different merge library, which that change must look at too. It is a
# CSS-compiler bump, so it gets its own change and a visual check. The second
# path has no deepmerge-free release (@rollup/plugin-node-resolve 16.0.3, which
# workbox-build 7.4.1 requires, still depends on it). ignoreUntil forces a
# re-check for either. Record:
# docs/security/dependency-advisories-2026-10-30.md.
[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-28
reason = "No fixed version exists (4.2.0-4.3.1 affected). Build-time only: vanilla-extract merges our .css.ts style objects (repo code and dependency constants), rollup's node-resolve its own defaults; none of it ships in the client bundle."

# minimatch globParts amplification (GHSA-g3hv-75wg-m249 / CVE-2026-118764,
# Moderate): at optimizationLevel >= 2 (in 7.0.0 and 7.0.1, with any
# options), firstPhasePreProcess() clones a pattern row for each `**/..`
# inside a fixpoint loop, so the rows double per occurrence, and
# secondPhasePreProcess() then compares every pair. OSV and GitHub list every
# version below 11.0.1 (introduced 0).
#
# Bumped where it could be. minimatch 10.2.5 left the lockfile with the glob
# override above: glob 14.0.3 depends on minimatch ^11.0.2 and runs its own
# bundled copy of 11.0.1's preprocessing. 5.1.9 moved to 11.0.3 through the
# "filelist@1>minimatch" override: its one consumer, filelist 1.0.6, calls
# only minimatch.match(). With 11.0.3 it returned the same lists for 15 of
# 16 patterns tested; minimatch 11 no longer matches `.` with `.*`, so
# `**/.*` drops `.`. Nothing here loads filelist.
#
# This entry covers what is left, minimatch 3.1.5, which does not contain the
# code: its minimatch.js has no firstPhasePreProcess, no optimizationLevel and
# no `**/..` row clone. The code first appears in 7.0.0, whose preprocess()
# runs it with default options; optimizationLevel, and the >= 2 condition,
# arrive in 7.1.0. It is absent from 4.2.6, 5.0.0, 5.1.9, 6.0.0, 6.2.0 and
# 6.2.3. The 3.x line has no fixed release, and its consumers cannot take 11:
#   - glob 7.2.3 (under react-native 0.82.1, @react-native/codegen, rimraf
#     3.0.2 and test-exclude 6.0.0) reads each pattern portion as a RegExp
#     (`pn._glob`, `e.match(pn)`); minimatch 11 keeps Matcher objects there.
#   - test-exclude 6.0.0 and eslint-plugin-react call the module itself as a
#     function, which minimatch 11's CommonJS build does not export.
#   - eslint 8.29.0, @eslint/eslintrc, @humanwhocodes/config-array and
#     eslint-plugin-import / jsx-a11y depend on it as well.
#
# Mirrored in pnpm.auditConfig.ignoreGhsas: `pnpm audit --prod
# --audit-level moderate` (guard:audit-clean) reports 3.1.5 on 42 production
# paths, packages/ui -> react-native 0.82.1 -> glob 7.2.3 / test-exclude
# 6.0.0, and exits 1. Not in .trivyignore: Moderate is below Trivy's
# CRITICAL/HIGH gate, and security.yml's pnpm audit (high) passes without it.
#
# The ignore is per ID, not per version or package: it also hides this
# advisory for any package GitHub adds to it later, such as a glob that
# bundles minimatch. A minimatch that does contain the code (7.0.0 to 11.0.0)
# entering the lockfile, for example 10.2.6 through eslint 10 (minimatch
# ^10.2.6), test-exclude 8 (^10.2.2) or filelist 2 (^10.2.1), would pass
# every gate: the OSV gates and guard:audit-clean because of this entry and
# its mirror, Trivy and security.yml's pnpm audit because it is Moderate. The
# OSV scan would print only its "filtered out" line, as it does now. A glob
# from 9.0.0 to 14.0.2 cannot come back that way: the glob override moves any
# request that overlaps that range to 14.0.3. A minimatch 5.x can, through a
# consumer other than filelist 1; like 3.1.5, it lacks the code.
#
# Plan: the advisory's range starts at 0, but the code starts at 7.0.0, with
# any options there and at optimizationLevel >= 2 from 7.1.0. The operator
# can ask github/advisory-database to correct `introduced`; once OSV follows,
# the scanner reports this entry as unused, and it and its mirror are
# deleted. Moving eslint does not clear it: eslint 9.39.5 still takes
# minimatch ^3.1.5, and eslint 10.14.0 takes ^10.2.6, which has the code.
# ignoreUntil = 2026-12-01 stops applying at 2026-12-01T00:00Z on CI (local
# midnight on the scanning host). Record:
# docs/security/dependency-advisories-2026-10-31.md.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-01
reason = "Only minimatch 3.1.5 remains (10.2.5 and 5.1.9 bumped to 11.0.3). Its minimatch.js has no firstPhasePreProcess, which first appears in 7.0.0 (unconditional until optimizationLevel arrived in 7.1.0); 3.x has no fix, and glob 7, test-exclude 6 and eslint-plugin-react cannot take 11."

# The braces stack-exhaustion ignore (GHSA-vfj7-8cjw-p6xm / CVE-2026-93687)
# used to sit here. GitHub withdrew that advisory on 2026-10-23 ("not a
# practically exploitable vulnerability"); OSV now carries it as withdrawn and
# no longer matches braces 3.0.3, which is still in the lockfile, so the
# scanner reported the entry as an unused ignore. Removed rather than left
# dead, together with its pnpm.auditConfig.ignoreGhsas mirror: if the advisory
# is ever reinstated the scan should fail loudly, not stay silenced. Record:
# docs/security/dependency-advisories-2026-10-23.md.

# The brace-expansion ReDoS ignore (GHSA-mh99-v99m-4gvg) used to sit here. The
