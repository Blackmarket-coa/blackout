name: Blackout Web Tests

on:
  pull_request:
    paths:
      - "apps/blackout-web/**"
      - ".github/workflows/blackout-web-tests.yml"
  push:
    branches: [develop, master]
    paths:
      - "apps/blackout-web/**"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies (core, design) for project references
        run: |
          pnpm --filter @blackout/core run build
          pnpm --filter @blackout/design run build

      - name: Lint
        run: pnpm --filter @blackout/blackout-web lint

      - name: Unit tests
        run: pnpm --filter @blackout/blackout-web test:unit

      - name: Integration tests
        run: pnpm --filter @blackout/blackout-web test:integration

      - name: Install Playwright browsers
        run: pnpm --filter @blackout/blackout-web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm --filter @blackout/blackout-web test:e2e
