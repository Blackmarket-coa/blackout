name: Load tests (k6 nightly)

# Least-privilege token: this workflow only reads repo contents.
permissions:
    contents: read

on:
    schedule:
        - cron: '0 4 * * *'
    workflow_dispatch:
        inputs:
            base_url:
                description: 'Override base URL (defaults to spinning up the api in-job)'
                required: false
                default: ''

jobs:
    k6:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: blackout
                    POSTGRES_PASSWORD: blackout
                    POSTGRES_DB: blackout
                options: >-
                    --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
                ports:
                    - 5432:5432
            redis:
                image: redis:7-alpine
                options: >-
                    --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
                ports:
                    - 6379:6379
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
            - uses: pnpm/action-setup@v5
              with:
                  version: 9.15.4
            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Apply migrations
              env:
                  DATABASE_URL: postgres://blackout:blackout@localhost:5432/blackout
              run: pnpm --filter @blackout/api migrate:up

            - name: Mint synthetic credentials for the load run
              id: synth
              run: |
                  # Generate a 64-byte high-entropy value with mixed character classes
                  # so the api's strength check is satisfied. Synthesized at job start,
                  # never committed.
                  BASE=$(openssl rand -base64 48 | tr -d '=' | tr '+/' '-_')
                  echo "::add-mask::$BASE"
                  GUARD="aZ9!"
                  echo "JWT=${BASE}${GUARD}" >> "$GITHUB_OUTPUT"
                  METRICS=$(openssl rand -hex 32)
                  echo "::add-mask::$METRICS"
                  echo "METRICS=${METRICS}" >> "$GITHUB_OUTPUT"

            - name: Start API in background
              if: ${{ github.event.inputs.base_url == '' }}
              env:
                  PORT: 3000
                  NODE_ENV: production
                  # Run against the postgres service (not the default `file`
                  # store). Without this the API silently ran in file mode and
                  # ignored the migrated database — and the production boot guard
                  # now refuses to start without it.
                  BLACKOUT_DB_MODE: postgres
                  DATABASE_URL: postgres://blackout:blackout@localhost:5432/blackout
                  REDIS_URL: redis://localhost:6379
                  JWT_SECRET_PRIMARY: ${{ steps.synth.outputs.JWT }}
                  CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
                  INTERNAL_METRICS_TOKEN: ${{ steps.synth.outputs.METRICS }}
                  # Required in production so pseudonymized log ids aren't guessable.
                  LOG_HASH_SALT: ${{ steps.synth.outputs.METRICS }}
                  # Production refuses to boot without an explicit mail transport
                  # (initMailerFromEnv, services/mailer.ts); for want of it every
                  # nightly from 2026-07-28 on died at this step. `console` is that
                  # guard's documented opt-in for staging shadows: register-flow
                  # verification mail is logged (recipient + subject) to api.log,
                  # never delivered.
                  MAIL_PROVIDER: console
              run: |
                  # Capture boot output so a startup failure is diagnosable
                  # instead of k6 silently hammering a dead port (and reporting a
                  # misleading 100%-failure "load result").
                  pnpm --filter @blackout/api start > api.log 2>&1 &
                  API_PID=$!
                  up=0
                  for i in {1..60}; do
                    if ! kill -0 "$API_PID" 2>/dev/null; then
                      echo "::error::API process exited during startup"; break
                    fi
                    if curl -fsS http://localhost:3000/health > /dev/null; then
                      echo "api up"; up=1; break
                    fi
                    sleep 1
                  done
                  if [ "$up" -ne 1 ]; then
                    echo "::error::API did not become healthy on :3000 — boot log:"
                    cat api.log || true
                    exit 1
                  fi

            - name: Upload API boot log
              if: ${{ always() && github.event.inputs.base_url == '' }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: api-boot-log
                  path: api.log
                  if-no-files-found: ignore

            # k6 comes from its GitHub release, checked against a pinned sha256,
            # not from the dl.k6.io apt repository.
            #
            # From 2026-10-25 to 2026-11-16 every nightly stopped in this step,
            # so no script ran. The step made the apt repository's keyring with
            # `gpg --keyring ... --recv-keys`, which writes a GnuPG keybox, and
            # the apt on the runner image that `ubuntu-latest` became that day
            # (Ubuntu 26.04) does not read a keybox as a keyring: "The key(s)
            # in the keyring ... are ignored as the file has an unsupported
            # filetype", then NO_PUBKEY for the repository and exit 100. On the
            # 24.04 image the same commands had passed since 2026-10-12. That
            # step also asked a keyserver for the key on every run and
            # installed whichever k6 the repository served that night.
            #
            # K6_SHA256 is the line for the linux-amd64 archive in
            # k6-v${K6_VERSION}-checksums.txt on the release page, and moves
            # with K6_VERSION. 2.3.0 is the version the four scripts below were
            # last checked against
            # (docs/audits/pre-launch-readiness-audit-2026-07.md, L8). The
            # archive is checked before anything is extracted, and sha256sum
            # and tar are called by absolute path, as for gitleaks in
            # security.yml; the download's retry flags are that step's too,
            # with --max-time raised for a 30 MB archive.
            - name: Install k6
              timeout-minutes: 10
              env:
                  K6_VERSION: '2.3.0'
                  K6_SHA256: '39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1'
              run: |
                  set -euo pipefail
                  name="k6-v${K6_VERSION}-linux-amd64.tar.gz"
                  url="https://github.com/grafana/k6/releases/download/v${K6_VERSION}/${name}"
                  archive="${RUNNER_TEMP}/k6/${name}"
                  mkdir -p "${RUNNER_TEMP}/k6"
                  curl --fail --location --no-progress-meter \
                      --connect-timeout 10 --max-time 120 \
                      --retry 12 --retry-connrefused --retry-delay 15 --retry-max-time 180 \
                      --output "$archive" "$url"
                  if ! echo "${K6_SHA256}  ${archive}" | /usr/bin/sha256sum --check --strict -; then
                      echo "::error::The downloaded k6 archive does not match K6_SHA256; not extracting it."
                      exit 1
                  fi
                  sudo /usr/bin/tar -xzf "$archive" -C /usr/local/bin --strip-components=1 \
                      "k6-v${K6_VERSION}-linux-amd64/k6"
                  k6 version

            - name: k6 — health
              env:
                  BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
              run: k6 run --summary-export=health-summary.json load/k6/health.js

            - name: k6 — auth flow
              env:
                  BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
              run: k6 run --summary-export=auth-summary.json load/k6/auth.js

            - name: k6 — rate limit contract
              env:
                  BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
              run: k6 run --summary-export=rate-limit-summary.json load/k6/rate-limit.js

            - name: k6 — coalition feed engagement
              env:
                  BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
              run: k6 run --summary-export=coalition-feed-summary.json load/k6/coalition-feed.js

            - name: Upload k6 summaries
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: k6-summaries
                  path: '*-summary.json'
