name: Blackout CI

on:
  push:
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blackout/client exec eslint "src/**/*.{ts,tsx}" --max-warnings=0

  typecheck:
    name: Type check (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies (core, design) for project references
        run: |
          pnpm --filter @blackout/core run build
          pnpm --filter @blackout/design run build
      - run: pnpm --filter @blackout/client run typecheck
      - run: pnpm --filter blackout-mobile run preflight

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies for project references
        run: |
          pnpm --filter @blackout/core run build
          pnpm --filter @blackout/design run build
      - run: pnpm --filter @blackout/client run test:unit
      - run: pnpm --filter @blackout/client run test:integration

  feature-registry-validation:
    name: Feature registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/ci/check-feature-registry.mjs


  matrix-sdk-baseline:
    name: Matrix SDK baseline alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/ci/check-matrix-sdk-version-alignment.mjs

  deployment-readiness:
    name: Deployment readiness assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/ci/check-deployment-readiness.mjs

  production-compose-image-policy:
    name: Production compose image policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - run: deploy/docker/production/scripts/check-no-latest-images.sh

  build-verification:
    name: Build verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ["@blackout/client", "blackout-mobile"]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fresh install (force relink)
        run: pnpm install --frozen-lockfile --force
      - run: pnpm --filter "${{ matrix.project }}" run build

  bundle-size:
    name: Bundle size check
    runs-on: ubuntu-latest
    env:
      MAX_BUNDLE_KB: 24576
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blackout/client run build
      - name: Check bundle size threshold
        run: |
          # Exclude .map files: source maps aren't shipped to users and
          # would dominate the size signal otherwise.
          BUNDLE_KB=$(du -sk --exclude='*.map' apps/blackout-client/dist | cut -f1)
          echo "Bundle size (excluding source maps): ${BUNDLE_KB}KB"
          if [ "$BUNDLE_KB" -gt "$MAX_BUNDLE_KB" ]; then
            echo "Bundle exceeds ${MAX_BUNDLE_KB}KB threshold"
            exit 1
          fi

  qa-monorepo:
    name: Monorepo QA conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run monorepo QA suite
        id: qa_monorepo
        continue-on-error: ${{ vars.MONOREPO_MIGRATION_THRESHOLD_MET != 'true' }}
        run: pnpm qa:monorepo
      - name: Upload monorepo QA artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qa-monorepo-artifacts
          path: artifacts/qa-monorepo
          if-no-files-found: warn
      - name: Enforce monorepo QA gate at threshold
        if: vars.MONOREPO_MIGRATION_THRESHOLD_MET == 'true' && steps.qa_monorepo.outcome != 'success'
        run: |
          echo "MONOREPO_MIGRATION_THRESHOLD_MET=true so qa:monorepo is required."
          exit 1

  frontend-consolidation-safety-gates:
    name: Frontend consolidation safety gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Anti-drift check for consolidation artifacts
        run: pnpm guard:frontend-consolidation
      - name: Keep canonical migration surfaces green
        run: pnpm --filter @blackout/blackout-gov test

  edge-hardening-guards:
    name: Edge hardening guards (CORS allowlist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CORS allowlist guard
        run: node tools/ci/check-cors-allowlist.mjs

  ops-artifacts-lint:
    name: Ops artifacts lint (alerts + dashboards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard:ops-artifacts

  audit-clean:
    name: Dependency audit (no advisories at moderate+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard:audit-clean

  helm-chart-lint:
    name: Helm chart lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Install helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4
        with:
          version: v3.15.4
      - name: Lint chart
        run: helm lint deploy/helm/blackout
      - name: Render default values
        run: helm template blackout deploy/helm/blackout > /tmp/blackout-default.yaml
      - name: Render with canary + external-secrets enabled
        run: |
          helm template blackout deploy/helm/blackout \
            --set canary.enabled=true \
            --set externalSecrets.enabled=true \
            --set api.observability.sentry.enabled=true \
            --set api.observability.otel.enabled=true \
            > /tmp/blackout-full.yaml

  api-smoke-and-integration:
    name: API smoke + integration (Hono app.fetch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration + reversibility verification
        run: |
          node tools/ci/check-db-migrations.mjs
          node tools/ci/verify-migrations-ephemeral.mjs
      - name: API integration tests
        env:
          BLACKOUT_DB_MODE: memory
          BLACKOUT_API_SKIP_LISTEN: "1"
          NODE_ENV: test
        run: pnpm --filter @blackout/api test:integration
