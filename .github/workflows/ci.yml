name: Blackout CI

on:
  push:
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blackout/client exec eslint "src/**/*.{ts,tsx}" --max-warnings=0

  typecheck:
    name: Type check (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies (core, design) for project references
        run: |
          pnpm --filter @blackout/core run build
          pnpm --filter @blackout/design run build
      - run: pnpm --filter @blackout/blackout-web exec tsc --noEmit
      - run: pnpm --filter blackout-mobile run preflight

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blackout/blackout-web exec vitest run tests/unit
      - run: pnpm --filter @blackout/blackout-web exec vitest run tests/integration

  component-tests:
    name: Component tests (Vitest + Testing Library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blackout/blackout-web exec vitest run --environment jsdom

  e2e-tests:
    name: E2E tests (Playwright + local Synapse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blackout/blackout-web exec playwright install --with-deps chromium
      - run: pnpm --filter @blackout/blackout-web run test:e2e

  matrix-protocol-tests:
    name: Matrix protocol sync tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run matrix-js-sdk sync mock tests
        run: pnpm --filter @blackout/blackout-web exec vitest run tests/unit tests/integration

  feature-registry-validation:
    name: Feature registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/ci/check-feature-registry.mjs

  deployment-readiness:
    name: Deployment readiness assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/ci/check-deployment-readiness.mjs

  build-verification:
    name: Build verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ["@blackout/blackout-web", "@blackout/client", "blackout-mobile"]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fresh install (force relink)
        run: pnpm install --frozen-lockfile --force
      - run: pnpm --filter "${{ matrix.project }}" run build

  bundle-size:
    name: Bundle size check
    runs-on: ubuntu-latest
    env:
      MAX_BUNDLE_KB: 2048
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blackout/blackout-web run build:web
      - name: Check bundle size threshold
        run: |
          BUNDLE_KB=$(du -sk apps/blackout-web/dist | cut -f1)
          echo "Bundle size: ${BUNDLE_KB}KB"
          if [ "$BUNDLE_KB" -gt "$MAX_BUNDLE_KB" ]; then
            echo "Bundle exceeds ${MAX_BUNDLE_KB}KB threshold"
            exit 1
          fi

  qa-monorepo:
    name: Monorepo QA conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run monorepo QA suite
        id: qa_monorepo
        continue-on-error: ${{ vars.MONOREPO_MIGRATION_THRESHOLD_MET != 'true' }}
        run: pnpm qa:monorepo
      - name: Upload monorepo QA artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qa-monorepo-artifacts
          path: artifacts/qa-monorepo
          if-no-files-found: warn
      - name: Enforce monorepo QA gate at threshold
        if: vars.MONOREPO_MIGRATION_THRESHOLD_MET == 'true' && steps.qa_monorepo.outcome != 'success'
        run: |
          echo "MONOREPO_MIGRATION_THRESHOLD_MET=true so qa:monorepo is required."
          exit 1

  frontend-consolidation-safety-gates:
    name: Frontend consolidation safety gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Anti-drift check for consolidation artifacts
        run: pnpm guard:frontend-consolidation
      - name: Legacy docs integrity gate
        run: node _port/scripts/operations/docs_integrity_check.cjs
      - name: Keep legacy/migration surfaces green
        run: |
          pnpm --filter @blackout/web test
          pnpm --filter @blackout/blackout-gov test
