name: Centralized CI Parity

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tools/ci/**'
      - '.github/workflows/centralized-ci-parity.yml'
      - 'docs/**'

jobs:
  parity:
    name: Canonical parity replay
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run parity pipeline
        run: pnpm ci:parity
