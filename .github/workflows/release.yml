name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # required for cosign keyless signing via Sigstore
  id-token: write
  attestations: write

jobs:
  build-web:
    name: Build web artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blackout/client run build

      - name: Generate SPDX SBOM for web bundle
        uses: anchore/sbom-action@v0
        with:
          path: apps/blackout-client
          format: spdx-json
          artifact-name: blackout-web-${{ github.ref_name }}.spdx.json
          output-file: apps/blackout-client/dist/sbom.spdx.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blackout-web-${{ github.ref_name }}
          path: apps/blackout-client/dist

  # Desktop bundles are produced by the dedicated cross-OS workflow
  # .github/workflows/blackout-desktop-tauri.yml (which also triggers on v* tags).
  # It builds + signs via tauri-action and attaches the installers + updater JSON
  # to this same release tag, so there is no separate build-desktop job here.

  build-mobile-android:
    name: Build mobile artifact (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Ensure Android project exists
        working-directory: blackout-mobile
        run: |
          if [ ! -f "android/gradlew" ]; then
            pnpm add:android
          fi
      - run: pnpm --filter blackout-mobile run sync:android
      - run: cd blackout-mobile/android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blackout-mobile-android-${{ github.ref_name }}
          path: blackout-mobile/android/app/build/outputs/**/*.apk
          if-no-files-found: warn

  build-mobile-ios:
    name: Build mobile artifact (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure iOS project exists
        working-directory: blackout-mobile
        run: |
          if [ ! -d "ios/App" ]; then
            pnpm add:ios
          fi
      - run: pnpm --filter blackout-mobile run sync:ios
      - name: Build iOS app (unsigned simulator build)
        working-directory: blackout-mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blackout-mobile-ios-${{ github.ref_name }}
          path: blackout-mobile/ios/App/build/Build/Products/**/*.app
          if-no-files-found: warn

  release:
    name: Create GitHub release + deploy
    needs: [build-web, build-mobile-android, build-mobile-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image build + push to GHCR
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          # The canonical `blackout` image is the backend API runtime the
          # production compose stack (app/worker/app_canary) pulls and runs via
          # ./bin/start-app | ./bin/start-worker. The static web client ships as
          # a release artifact (build-web job) and as the separate
          # ghcr.io/blackmarket-coa/blackout-web image published by docker.yml.
          context: .
          file: apps/blackout-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/blackmarket-coa/blackout:latest
            ghcr.io/blackmarket-coa/blackout:stable
            ghcr.io/blackmarket-coa/blackout:${{ github.ref_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign published Docker image (keyless / OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            "ghcr.io/blackmarket-coa/blackout@${{ steps.docker_build.outputs.digest }}"

      - name: Sign release artifacts (keyless / OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for f in artifacts/**/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sig|*.pem|*.bundle) continue ;;
            esac
            echo "Signing $f"
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              --bundle "$f.bundle" \
              "$f"
          done

      - name: Attach signatures to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.sig
            artifacts/**/*.pem
            artifacts/**/*.bundle

      - name: Deploy to production
        run: |
          curl --fail --show-error -X POST "$PRODUCTION_DEPLOY_WEBHOOK"
        env:
          PRODUCTION_DEPLOY_WEBHOOK: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}

      - name: Notify Matrix room of new release
        run: |
          MESSAGE="🚀 Blackout release ${{ github.ref_name }} is live."
          curl --fail --show-error -X POST \
            -H "Authorization: Bearer $MATRIX_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "$MATRIX_HOMESERVER/_matrix/client/v3/rooms/$MATRIX_ROOM_ID/send/m.room.message/$(date +%s)" \
            -d "{\"msgtype\":\"m.text\",\"body\":\"${MESSAGE}\"}"
        env:
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
