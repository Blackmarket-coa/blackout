name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-web:
    name: Build web artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blackout/blackout-web run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: blackout-web-${{ github.ref_name }}
          path: apps/blackout-web/dist

  build-desktop:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build desktop app
        working-directory: blackout-desktop
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: blackout-desktop-${{ matrix.os }}-${{ github.ref_name }}
          path: blackout-desktop/src-tauri/target/release/bundle
          if-no-files-found: warn

  build-mobile:
    name: Build mobile artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter blackout-mobile run sync:android
      - run: cd blackout-mobile/android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: blackout-mobile-${{ github.ref_name }}
          path: blackout-mobile/android/app/build/outputs/**/*.apk
          if-no-files-found: warn

  release:
    name: Create GitHub release + deploy
    needs: [build-web, build-desktop, build-mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image build + push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/blackmarket-coa/blackout:latest
            ghcr.io/blackmarket-coa/blackout:${{ github.ref_name }}

      - name: Deploy to production
        run: |
          curl --fail --show-error -X POST "$PRODUCTION_DEPLOY_WEBHOOK"
        env:
          PRODUCTION_DEPLOY_WEBHOOK: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}

      - name: Notify Matrix room of new release
        run: |
          MESSAGE="🚀 Blackout release ${{ github.ref_name }} is live."
          curl --fail --show-error -X POST \
            -H "Authorization: Bearer $MATRIX_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "$MATRIX_HOMESERVER/_matrix/client/v3/rooms/$MATRIX_ROOM_ID/send/m.room.message/$(date +%s)" \
            -d "{\"msgtype\":\"m.text\",\"body\":\"${MESSAGE}\"}"
        env:
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
