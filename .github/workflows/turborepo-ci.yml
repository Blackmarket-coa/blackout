name: Turborepo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turborepo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  gates:
    name: Lint / Typecheck / Test (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute turbo filter
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=...[origin/${{ github.base_ref }}]" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "value=...[HEAD^1]" >> "$GITHUB_OUTPUT"
          else
            echo "value=..." >> "$GITHUB_OUTPUT"
          fi

      - name: Show remote cache status
        run: |
          if [[ -n "${TURBO_TOKEN}" && -n "${TURBO_TEAM}" ]]; then
            echo "Turbo remote cache: enabled"
          else
            echo "Turbo remote cache: disabled (set TURBO_TOKEN + TURBO_TEAM secrets to enable)"
          fi
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Lint (affected)
        run: pnpm turbo run lint --filter="${{ steps.filter.outputs.value }}"
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_API: ${{ secrets.TURBO_API }}

      - name: Typecheck (affected)
        run: pnpm turbo run typecheck --filter="${{ steps.filter.outputs.value }}"
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_API: ${{ secrets.TURBO_API }}

      - name: Test (affected)
        run: pnpm turbo run test --filter="${{ steps.filter.outputs.value }}"
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_API: ${{ secrets.TURBO_API }}

      - name: Build (affected)
        run: pnpm turbo run build --filter="${{ steps.filter.outputs.value }}"
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_API: ${{ secrets.TURBO_API }}

  release-tag:
    name: Release tag
    runs-on: ubuntu-latest
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Create CI release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="release-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag already exists: $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated release tag for ${GITHUB_SHA}"
          git push origin "$TAG"
          echo "Created tag: $TAG"
