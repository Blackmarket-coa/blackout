name: blackout-mobile

# Least-privilege token: this workflow only reads repo contents.
permissions:
    contents: read

# Signed store release builds (beta/production). Internal-track builds on main
# are owned by mobile-native-ci.yml, so this workflow only runs on explicit
# release tags (and manual dispatch) to avoid duplicate heavy native builds.
on:
    push:
        tags:
            - 'mobile-release-*'
    workflow_dispatch:

jobs:
    android:
        runs-on: ubuntu-22.04
        defaults:
            run:
                working-directory: blackout-mobile
        env:
            # Surfaced from secrets so the signing step can be conditionally skipped
            # (unsigned release builds still succeed when no keystore is configured).
            ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: pnpm/action-setup@v5
              with:
                  version: 9.15.4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Ensure Android project exists
              run: |
                  if [ ! -f "android/gradlew" ]; then
                    pnpm add:android
                  fi
            - name: Sync Capacitor project
              run: pnpm sync:android
            - name: Configure release signing
              if: env.ANDROID_UPLOAD_KEYSTORE_B64 != ''
              env:
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  echo "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/blackout-upload.jks"
                  cat > android/keystore.properties <<PROPS
                  storeFile=$RUNNER_TEMP/blackout-upload.jks
                  storePassword=${ANDROID_KEYSTORE_PASSWORD}
                  keyAlias=${ANDROID_KEY_ALIAS}
                  keyPassword=${ANDROID_KEY_PASSWORD}
                  PROPS
            - name: Build Android release (AAB + APK)
              run: |
                  cd android
                  ./gradlew bundleRelease assembleRelease
            - name: Upload Android artifacts
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: blackout-android-release
                  path: |
                      blackout-mobile/android/app/build/outputs/**/*.aab
                      blackout-mobile/android/app/build/outputs/**/*.apk
                  if-no-files-found: warn

    ios:
        runs-on: macos-latest
        defaults:
            run:
                working-directory: blackout-mobile
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: pnpm/action-setup@v5
              with:
                  version: 9.15.4
            - name: Install Ruby and Fastlane
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.2'
                  bundler-cache: false
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Ensure iOS project exists
              run: |
                  if [ ! -d "ios/App" ]; then
                    pnpm add:ios
                  fi
            - name: Sync Capacitor project
              run: pnpm sync:ios
            - name: Build/TestFlight upload with Fastlane
              env:
                  APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
                  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
              run: |
                  cd ios
                  fastlane beta
