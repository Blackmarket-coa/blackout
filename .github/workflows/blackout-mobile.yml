name: blackout-mobile

on:
  push:
    branches: [main]
    tags:
      - 'mobile-release-*'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: blackout-mobile
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync Capacitor project
        run: pnpm sync:android
      - name: Build Android release
        run: |
          cd android
          ./gradlew assembleRelease
      - name: Upload Android artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blackout-android-release
          path: blackout-mobile/android/app/build/outputs/**/*.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: blackout-mobile
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - name: Install Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync Capacitor project
        run: pnpm sync:ios
      - name: Build/TestFlight upload with Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          cd ios
          fastlane beta
