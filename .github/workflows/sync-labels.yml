name: Sync labels
on:
    workflow_dispatch: {}
    schedule:
        - cron: "0 1 * * *" # 1am every day
    push:
        branches:
            - develop
        paths:
            - .github/labels.yml

# Previously this called element-hq/element-meta's reusable sync-labels
# workflow, which (a) authenticated with an ELEMENT_BOT_TOKEN secret this
# fork does not have — every nightly run 401'd at the first label write —
# and (b) kept element-hq/element-meta as a label SOURCE, so the ~40
# Element-internal labels dropped from .github/labels.yml during launch
# prep would have been re-added on every successful sync and never
# pruned. This self-contained job syncs from the local manifest only,
# with the default workflow token, and prunes anything not in it.
permissions:
    issues: write

jobs:
    sync-labels:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1.3.0
              with:
                  manifest: .github/labels.yml
                  prune: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
