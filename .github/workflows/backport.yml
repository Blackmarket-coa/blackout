name: Backport
on:
    pull_request_target:
        types:
            - closed
            - labeled
        branches:
            - develop

permissions: {} # We use ELEMENT_BOT_TOKEN instead

jobs:
    backport:
        name: Backport
        runs-on: ubuntu-24.04
        # `secrets` is not an allowed context in a step-level `if:`; `env` is.
        # Reading it here is what makes the guards below valid.
        env:
            ELEMENT_BOT_TOKEN: ${{ secrets.ELEMENT_BOT_TOKEN }}
        # Only react to merged PRs for security reasons.
        # See https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target.
        if: >
            github.event.pull_request.merged == true
            && contains(join(github.event.pull_request.labels.*.name, ','), 'backport ')
            && (
              github.event.action == 'closed'
              || (
                github.event.action == 'labeled'
                && startsWith(github.event.label.name, 'backport ')
              )
            )
        steps:
            - name: Skip if backport token missing
              if: ${{ env.ELEMENT_BOT_TOKEN == '' }}
              run: |
                  echo "ELEMENT_BOT_TOKEN unset — skipping backport."
                  exit 0
            - uses: tibdex/backport@9565281eda0731b1d20c4025c43339fb0a23812e # v2
              if: ${{ env.ELEMENT_BOT_TOKEN != '' }}
              with:
                  labels_template: "<%= JSON.stringify([...labels, 'X-Release-Blocker']) %>"
                  # We can't use GITHUB_TOKEN here or CI won't run on the new PR
                  github_token: ${{ secrets.ELEMENT_BOT_TOKEN }}
