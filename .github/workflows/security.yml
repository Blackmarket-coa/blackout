name: Security checks

on:
    pull_request:
        paths:
            - "apps/**"
            - "packages/**"
            - "pnpm-lock.yaml"
            - "package.json"
            - "scripts/**"
            - ".github/workflows/security.yml"
    push:
        branches: [develop, master, main]
    merge_group:
        types: [checks_requested]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

permissions:
    contents: read
    security-events: write

jobs:
    dependency_audit:
        name: Dependency vulnerability audit
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v5
              with:
                  version: 9.15.4

            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
              with:
                  node-version-file: ".node-version"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: pnpm audit (high+ only)
              continue-on-error: true
              run: pnpm audit --prod --audit-level high

            - name: OSV scanner
              uses: google/osv-scanner-action/osv-scanner-action@v2.3.3
              with:
                  scan-args: |-
                      --lockfile=pnpm-lock.yaml

    semgrep:
        name: Semgrep SAST
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

            - name: Semgrep
              uses: semgrep/semgrep-action@v1
              with:
                  config: >-
                      p/security-audit
                      p/secrets

    gitleaks:
        name: Gitleaks secret scan
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
              with:
                  fetch-depth: 0

            - name: Run Gitleaks (pull request range)
              if: github.event_name == 'pull_request'
              uses: gitleaks/gitleaks-action@v2
              with:
                  args: detect --redact --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Run Gitleaks (push/merge queue range)
              if: github.event_name != 'pull_request'
              uses: gitleaks/gitleaks-action@v2
              with:
                  args: detect --redact --log-opts="${{ github.event.before }}..${{ github.sha }}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    trivy:
        name: Trivy filesystem scan
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

            - name: Trivy FS scan
              uses: aquasecurity/trivy-action@0.24.0
              with:
                  scan-type: fs
                  scan-ref: .
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: "0"
