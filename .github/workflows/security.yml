name: Security checks

on:
    pull_request:
        paths:
            - 'apps/**'
            - 'packages/**'
            - 'pnpm-lock.yaml'
            - 'package.json'
            - '.github/workflows/security.yml'
            - '.gitleaksignore'
            - 'osv-scanner.toml'
    push:
        branches: [develop, master, main]
    merge_group:
        types: [checks_requested]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

permissions:
    contents: read
    security-events: write

jobs:
    dependency_audit:
        name: Dependency vulnerability audit
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: pnpm/action-setup@v5
              with:
                  version: 9.15.4

            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
              with:
                  node-version-file: '.node-version'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: pnpm audit (high+; blocking)
              # Fails the build on any high/critical advisory in the production
              # tree. Reviewed, non-applicable advisories are documented and
              # silenced via pnpm.auditConfig.ignoreGhsas in package.json (and
              # OSV via osv-scanner.toml) — not by making this step non-blocking.
              run: pnpm audit --prod --audit-level high

            - name: OSV scanner
              uses: google/osv-scanner-action/osv-scanner-action@v2.3.3
              with:
                  scan-args: |-
                      --lockfile=pnpm-lock.yaml

    semgrep:
        name: Semgrep SAST
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
              with:
                  persist-credentials: false

            - name: Semgrep
              uses: semgrep/semgrep-action@v1
              with:
                  config: >-
                      p/security-audit
                      p/secrets

    gitleaks:
        name: Gitleaks secret scan
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Use the gitleaks CLI directly instead of `gitleaks/gitleaks-action@v2`
            # because the v2 action's trial period ended for organization
            # accounts in Oct 2023; without a `GITLEAKS_LICENSE` it fails
            # regardless of whether actual leaks exist. The CLI binary is
            # MIT-licensed and freely usable. .gitleaksignore at repo root
            # is honored automatically.
            - name: Install gitleaks
              env:
                  GITLEAKS_VERSION: '8.21.2'
              run: |
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                      | sudo tar -xz -C /usr/local/bin gitleaks
                  gitleaks version

            - name: Run gitleaks (pull request range)
              if: github.event_name == 'pull_request'
              run: |
                  gitleaks detect --redact --no-banner \
                      --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

            - name: Run gitleaks (push/merge queue range)
              if: github.event_name != 'pull_request'
              run: |
                  gitleaks detect --redact --no-banner \
                      --log-opts="${{ github.event.before }}..${{ github.sha }}"

    trivy:
        name: Trivy filesystem scan
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
              with:
                  persist-credentials: false

            - name: Trivy FS scan
              uses: aquasecurity/trivy-action@v0.35.0
              with:
                  scan-type: fs
                  scan-ref: .
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  # Vulnerabilities only — secret scanning is owned by the
                  # dedicated gitleaks job (with .gitleaksignore), so Trivy does
                  # not double-report the vendored Synapse test-key fixtures
                  # (e.g. synapse/util/manhole.py's upstream demo RSA key).
                  scanners: vuln
                  # Blocking: fail on fixable CRITICAL/HIGH findings. Reviewed,
                  # non-applicable advisories are documented in .trivyignore.
                  exit-code: '1'
                  trivyignores: .trivyignore
