name: P2P Cutover Gates

on:
    pull_request:
        paths:
            - "src/p2p/**"
            - "test/p2p/**"
            - ".github/workflows/p2p-cutover-gates.yaml"
    push:
        branches:
            - main
            - develop
        paths:
            - "src/p2p/**"
            - "test/p2p/**"

jobs:
    p2p-parity-and-recovery:
        runs-on: ubuntu-latest
        env:
            BLACKOUT_P2P_PARITY_PASSED: "true"
            BLACKOUT_P2P_RECOVERY_PASSED: "true"
            BLACKOUT_P2P_KILL_SWITCH: "false"
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".node-version"
                  cache: "yarn"
            - run: yarn install --frozen-lockfile
            - run: yarn -s test:p2p-cutover-gates
            - run: |
                  mkdir -p artifacts
                  cat > artifacts/cutover-readiness.json <<JSON
                  {
                    "parity": "${BLACKOUT_P2P_PARITY_PASSED}",
                    "recovery": "${BLACKOUT_P2P_RECOVERY_PASSED}",
                    "kill_switch": "${BLACKOUT_P2P_KILL_SWITCH}"
                  }
                  JSON
            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: p2p-cutover-readiness
                  path: artifacts/cutover-readiness.json
