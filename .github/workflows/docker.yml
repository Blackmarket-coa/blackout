name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: meta
        run: |
          VERSION_TAG="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION_TAG="main-${GITHUB_SHA::7}"
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/blackmarket-coa/blackout:latest
            ghcr.io/blackmarket-coa/blackout:${{ steps.meta.outputs.version_tag }}
          build-args: |
            APP_TARGET=web

      - name: Verify web client served by nginx
        run: |
          docker run --rm -d --name blackout-nginx -p 8080:80 ghcr.io/blackmarket-coa/blackout:${{ steps.meta.outputs.version_tag }}
          sleep 5
          curl --fail --show-error http://localhost:8080/
          docker stop blackout-nginx
