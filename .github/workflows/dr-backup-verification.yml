name: dr-backup-verification

# Least-privilege token: this workflow only reads repo contents.
permissions:
    contents: read

on:
    schedule:
        - cron: '30 3 * * *'
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to verify against'
                required: false
                default: production

jobs:
    verify-backup-and-pitr:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: restore
                    POSTGRES_PASSWORD: restore
                    POSTGRES_DB: blackout_restore
                options: >-
                    --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
                ports:
                    - 5432:5432
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

            - uses: pnpm/action-setup@v5
              with:
                  version: 9.15.4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Verify migration round-trip on ephemeral DB
              run: node tools/ci/verify-migrations-ephemeral.mjs

            - name: Apply current migrations into restore target
              env:
                  DATABASE_URL: postgres://restore:restore@localhost:5432/blackout_restore
              run: pnpm --filter @blackout/api migrate:up

            - name: Schema + integrity assertions
              env:
                  PGPASSWORD: restore
              run: |
                  psql -h localhost -U restore -d blackout_restore -v ON_ERROR_STOP=1 <<'EOSQL'
                  SELECT count(*) >= 1 AS schema_migrations_present FROM schema_migrations;

                  SELECT
                    (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='users') = 1 AS users_present,
                    (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='refresh_tokens') = 1 AS refresh_tokens_present,
                    (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='password_reset_tokens') = 1 AS password_reset_present,
                    (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='revoked_sessions') = 1 AS revoked_sessions_present;

                  DO $$
                  DECLARE prev INT := -1;
                  DECLARE cur INT;
                  BEGIN
                    FOR cur IN SELECT ordinal FROM schema_migrations ORDER BY ordinal LOOP
                      IF cur <= prev THEN
                        RAISE EXCEPTION 'schema_migrations ordinals not strictly monotonic: % then %', prev, cur;
                      END IF;
                      prev := cur;
                    END LOOP;
                  END $$;
                  EOSQL

            - name: Record PITR runbook reference
              run: |
                  mkdir -p artifacts
                  {
                    echo "Drill date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                    echo "Environment: ${{ github.event.inputs.environment || 'scheduled-nightly' }}"
                    echo
                    echo "Step-by-step PITR runbook: docs/operations/runbooks/postgres_restore_drill.md"
                    echo "Migration round-trip: tools/ci/verify-migrations-ephemeral.mjs"
                    echo
                    echo "Verified:"
                    echo " - migrate:up applies cleanly against a fresh PostgreSQL 16 instance"
                    echo " - migrate down/up round-trip succeeds on every reversible migration"
                    echo " - schema_migrations is populated and strictly monotonic"
                    echo " - canary tables (users, refresh_tokens, password_reset_tokens, revoked_sessions) exist"
                  } > artifacts/dr-backup-verification.txt

            - name: Upload verification artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: dr-backup-verification
                  path: artifacts/dr-backup-verification.txt
