name: Mobile Contract Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  mobile-contract:
    name: Mobile automation harness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run blackout-client unit suite
        run: pnpm --filter @blackout/client test:unit

      - name: Run blackout-client integration suite
        run: pnpm --filter @blackout/client test:integration
        continue-on-error: true

      - name: Run mobile harness tests
        run: pnpm web:test:mobile
