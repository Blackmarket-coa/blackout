name: blackout-desktop-build-check

# Build-only check of the desktop app (blackout-desktop, Tauri 2) on the three
# runners the release job uses, with the release job's bundles and setup.
# Unlike the release job it builds unsigned (--no-sign), so it has neither of
# the release job's signing steps, makes no updater artifact, and no bundle
# leaves the runner: no release, no tag, no uploaded artifact (an unsigned
# build downloadable from a public repository can be taken for a release).
# The job summary lists only the bundles' names and sizes. It references no
# secret.
#
# The release is blackout-desktop-tauri.yml. Do not dispatch that workflow to
# test a build: its tauri-action step is configured to publish a public,
# non-draft release named after the ref, with the updater's latest.json, once
# its build passes (docs/security/dependency-advisories-server-desktop-2026-10-30.md,
# Found outside scope, item 6). Dispatch this one instead, once it is on
# develop. Keep the setup below in step with that workflow's build job.
# Where this file's triggers, permissions, concurrency, steps or step
# settings differ from that job's, a comment says why.

# The release job runs on pushes to main, on release-* and v* tags and on
# dispatch, never on a pull request. This check exists to build before any
# of those, so it runs on pull requests to develop, the default branch, and
# on dispatch.
on:
    pull_request:
        branches: [develop]
        paths:
            # What the Rust build and the bundler read: tauri.conf.json,
            # Cargo.toml, Cargo.lock, src/, capabilities/, entitlements.plist,
            # the icon SVG, and package.json (the @tauri-apps/cli range).
            - 'blackout-desktop/**'
            - '.github/workflows/blackout-desktop-build-check.yml'
            # Resolves @tauri-apps/cli, which is the bundler, and every tool
            # the frontend build runs.
            - 'pnpm-lock.yaml'
            # Root overrides, packageManager, the prepare script, and the
            # workspace membership that the frontend hook relies on.
            - 'package.json'
            - 'pnpm-workspace.yaml'
            # The frontend build's own configuration. This job is the only
            # pull-request build of the client on macOS, and the only CI build
            # of it on Windows, so a path or plugin change here can break only
            # here. The rest of the client is platform-independent JavaScript,
            # which ci.yml already builds on every pull request.
            - 'apps/blackout-client/package.json'
            - 'apps/blackout-client/vite.config.*'
            - 'apps/blackout-client/build.config.ts'
            # The desktop bridge; the release workflow's own filter lists it.
            - 'apps/blackout-client/src/platform/**'
    workflow_dispatch:

# The release workflow has contents: write, to create its release. This one
# only reads the checkout.
permissions:
    contents: read

# The release workflow has no concurrency block. Here a newer push to the
# same pull request cancels the running build, whose result would be stale,
# and so does a later dispatch on the same branch; a cancelled leg shows as
# cancelled, not as passed.
concurrency:
    group: blackout-desktop-build-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Unsigned build (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                # The release job's os and bundle pairs. expect is added: the
                # bundle paths the last step requires.
                include:
                    - os: ubuntu-22.04
                      bundle: 'deb,rpm,appimage'
                      expect: 'deb/*.deb rpm/*.rpm appimage/*.AppImage'
                    - os: macos-latest
                      bundle: 'app,dmg'
                      expect: 'macos/*.app dmg/*.dmg'
                    - os: windows-latest
                      bundle: 'msi,nsis'
                      expect: 'msi/*.msi nsis/*-setup.exe'
        runs-on: ${{ matrix.os }}
        # A cost bound; the release job has none (GitHub's default, 360). The
        # local Linux compile took 8.5 minutes with 3 jobs. A leg that runs
        # past 60 fails, it does not pass. Revisit with the first run's leg
        # times.
        timeout-minutes: 60

        steps:
            # persist-credentials false is hardening the release job lacks.
            # Nothing in the build uses the token: Cargo.lock has no git
            # source and pnpm-lock.yaml no git dependency.
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
              with:
                  persist-credentials: false

            # The release job has setup-node@v4. This is v6.2.0, the commit
            # security.yml and load.yml pin. Both install Node 22, and
            # neither caches here: there is no cache input, and v6 caches on
            # its own only when packageManager names npm (it names pnpm).
            - name: Setup Node
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
              with:
                  node-version: 22

            # The release job and the other workflows have pnpm/action-setup@v5.
            # This is the commit v5 (and v5.0.0) names on 2026-11-02, pinned
            # like checkout and setup-node so that a moved tag cannot change
            # what runs here.
            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: 9.15.4

            # The commit at the head of the action's stable branch; it installs
            # the current stable Rust, as the release job's @stable does.
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

            # The release job's packages. Because the app registers deep-link
            # schemes, the AppImage bundler also copies /usr/bin/xdg-mime
            # (xdg-utils) into the image. The runner image should have it: it
            # installs Google Chrome's deb, which depends on xdg-utils (read
            # from the image's build scripts, not seen on a runner). If the
            # AppImage step stops at "xdg-mime binary not found", add
            # xdg-utils here and in the release job.
            - name: Install Linux deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # tauri.conf.json references icons generated from blackout.svg,
            # which are gitignored; the release job generates them the same way.
            - name: Generate app icons
              working-directory: blackout-desktop
              run: pnpm tauri icon src-tauri/icons/blackout.svg --output src-tauri/icons

            # --no-sign skips code signing, notarization and updater signing.
            # The --config merge reaches the CLI's bundler settings (tauri-cli
            # 2.10.1, interface/rust.rs 837), so no updater bundle is made and
            # no updater signing is attempted. It does not change the compiled
            # app on this point: the app embeds createUpdaterArtifacts at its
            # default whatever the config says (tauri-utils 2.10.2, config.rs
            # 4548), as the release's does. --ci is explicit here; the release
            # gets the same from CI=true, which the CLI reads as --ci.
            # tauri-action sets TAURI_BUNDLER_DMG_IGNORE_CI on macOS, so the
            # release runs the DMG's Finder layout step; only the macOS DMG
            # bundler reads it.
            #
            # The release reaches the same CLI (2.10.1, from the lockfile)
            # through `npm run tauri build -- --bundles <set>`: tauri-action
            # looks for a pnpm-lock.yaml only in blackout-desktop, and the
            # workspace's is at the root. This step uses pnpm, the
            # workspace's package manager. The two set different npm_config_*
            # variables; the one the CLI reads, npm_config_user_agent, picks
            # the package manager for its version-mismatch check. On Linux
            # both ways passed that check, and a probe hook with the same
            # --filter found the client from blackout-desktop (measured with
            # a stand-in cargo that stops before the compile). The real client
            # build has run only this way.
            #
            # shell: bash keeps the quoting the same on all three OSes. On
            # Windows that starts the CLI from Git Bash, where tauri-action
            # starts it from node, and pnpm runs the script through cmd with
            # each argument JSON.stringify'd. That the --config JSON arrives
            # intact there is unmeasured until the first Windows leg; a
            # mangled value fails the CLI's JSON parse, it does not pass. If
            # that leg fails at --config, move the JSON to a file under
            # blackout-desktop/src-tauri and pass its path.
            - name: Build unsigned bundles, no updater artifacts
              working-directory: blackout-desktop
              shell: bash
              env:
                  BUNDLES: ${{ matrix.bundle }}
                  TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
              run: |
                  pnpm tauri build --ci --no-sign --bundles "$BUNDLES" \
                      --config '{"bundle":{"createUpdaterArtifacts":false}}'

            # The release job has no such step; tauri-action uploads what it
            # builds. This one lists the bundles' names and sizes in the job
            # summary and uploads nothing.
            - name: Check the bundles, no updater output, Cargo.lock unchanged
              shell: bash
              env:
                  EXPECT: ${{ matrix.expect }}
                  OS: ${{ matrix.os }}
              run: |
                  dir=blackout-desktop/src-tauri/target/release/bundle
                  status=0
                  {
                      echo "### Unsigned bundles on $OS (built, not uploaded)"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  for pattern in $EXPECT; do
                      found=0
                      for f in "$dir"/$pattern; do
                          [ -e "$f" ] || continue
                          found=1
                          if [ -d "$f" ]; then
                              size="$(du -sk "$f" | cut -f1) KiB (directory)"
                          else
                              size="$(wc -c < "$f" | tr -d ' ') bytes"
                          fi
                          echo "${f#"$dir"/}  $size" | tee -a "$GITHUB_STEP_SUMMARY"
                      done
                      if [ "$found" = 0 ]; then
                          echo "::error::no bundle matches $pattern"
                          status=1
                      fi
                  done
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  # Not *.tar.gz: the deb staging directory holds data.tar.gz.
                  updater="$(find "$dir" \( -name '*.sig' -o -name '*.app.tar.gz' \
                      -o -name '*.AppImage.tar.gz' -o -name '*.msi.zip' -o -name '*.nsis.zip' \
                      -o -name 'latest.json' \) -print)"
                  if [ -n "$updater" ]; then
                      echo "::error::updater artifacts were produced: $updater"
                      status=1
                  fi
                  if ! git diff --exit-code --stat -- blackout-desktop/src-tauri/Cargo.lock; then
                      echo '::error::the build changed Cargo.lock'
                      status=1
                  fi
                  exit "$status"
