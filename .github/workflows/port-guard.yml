name: Port Guard

on:
  pull_request:
    paths:
      - '_port/**'
      - 'tools/ci/check-no-port-changes.mjs'
      - 'package.json'
      - '.github/workflows/port-guard.yml'
  push:
    branches: [develop, master]
    paths:
      - '_port/**'
      - 'tools/ci/check-no-port-changes.mjs'
      - 'package.json'
      - '.github/workflows/port-guard.yml'

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard local changes
        run: pnpm guard:port

      - name: Validate guard script behavior
        run: pnpm test:guard:port

      - name: Guard PR range
        if: github.event_name == 'pull_request'
        run: pnpm guard:port:range -- --base "origin/${{ github.base_ref }}"
