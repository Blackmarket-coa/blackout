name: tracker-evidence-validation

on:
    pull_request:
    push:
        branches:
            - main
            - master
    workflow_dispatch:

jobs:
    validate-tracker-evidence:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

            - name: Validate tracker evidence artifacts
              run: scripts/operations/validate_tracker_evidence.sh
