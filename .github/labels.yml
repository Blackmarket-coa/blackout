  description: "Data risk, sign-in broken, hosted instance down."
  color: "B60205"
- name: "severity:high"
  description: "Major feature unusable for many users."
  color: "D93F0B"
- name: "severity:medium"
  description: "Feature degraded; workaround exists."
  color: "FBCA04"
- name: "severity:low"
  description: "Minor; cosmetic or rare path."
  color: "0E8A16"
- name: "severity:papercut"
  description: "Visible, impactful, easy to action."
  color: "cccccc"

