# Blackout label scheme
#
# Conventions:
#   T-*          — type of work (Defect, Enhancement, Task, etc.)
#   area:*       — Blackout subsystem
#   surface:*    — which platform the change affects
#   severity:*   — defect severity
#   role:*       — V1 test-flight contributor role (per CONTRIBUTOR_ROLES.md)
#   challenge:*  — Coliseum Coalition challenge (per docs/coliseum/)
#   H{N}-{N}     — V1 test-flight cohort (mapped to the 96h timeline)
#   X-*          — blockers / exclusions
#   Z-*          — meta (flaky tests, coverage skips, etc.)

# --- Type ---------------------------------------------------------------
- name: "T-Defect"
  description: "Bug. Something is broken."
  color: "B60205"
- name: "T-Enhancement"
  description: "New feature or improvement."
  color: "0E8A16"
- name: "T-Task"
  description: "No user-facing change (refactor, CI, docs, tests)."
  color: "98e6ae"
- name: "T-Deprecation"
  description: "Removes or deprecates something."
  color: "98e6ae"
- name: "T-Other"
  description: "Questions, support, anything else."
  color: "98e6ae"
- name: "T-Coliseum-Finding"
  description: "Finding reported against a Coliseum challenge."
  color: "FBCA04"
- name: "T-Onboarding"
  description: "Onboarding / first-run friction."
  color: "98e6ae"
- name: "T-Security-Concern"
  description: "Non-exploitable security concern. For vulnerabilities use SECURITY.md."
  color: "D93F0B"

