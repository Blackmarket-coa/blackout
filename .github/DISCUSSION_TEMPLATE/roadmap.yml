title: "[Roadmap input] "
labels: ["roadmap-input"]
body:
    - type: markdown
      attributes:
          value: |
              Use this to surface what you'd like to see in **V1.1** and beyond. We harvest this category when drafting
              [`docs/launch/V1.1_ROADMAP.md`](https://github.com/Blackmarket-coa/blackout/blob/develop/docs/launch/V1.1_ROADMAP.md)
              at the end of the 96-hour test flight.

              For bugs use [Issues](https://github.com/Blackmarket-coa/blackout/issues/new/choose). For new features at idea stage, this is the right place.
    - type: textarea
      id: ask
      attributes:
          label: What do you want?
          placeholder: One sentence. Then expand below.
      validations:
          required: true
    - type: textarea
      id: why
      attributes:
          label: Why
          description: Who else has asked for this? What does it unlock? What hurts without it?
      validations:
          required: true
    - type: input
      id: linked-issue
      attributes:
          label: Linked issue (if any)
          placeholder: "#123"
      validations:
          required: false
