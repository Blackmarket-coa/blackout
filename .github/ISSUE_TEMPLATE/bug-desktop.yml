name: Bug report (Blackout desktop)
description: File a bug for the Blackout Tauri desktop app (not the web client).
labels: [T-Defect, surface:desktop, needs-triage]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to file a bug.

              **Security vulnerabilities do not go here.** File those via
              [Security Advisories](https://github.com/Blackmarket-coa/blackout/security/advisories/new) —
              see [`SECURITY.md`](https://github.com/Blackmarket-coa/blackout/blob/develop/SECURITY.md).
    - type: textarea
      id: reproduction-steps
      attributes:
          label: Steps to reproduce
          description: Attach screenshots, videos, or logs if you can.
          placeholder: Tell us what you see!
          value: |
              1. Where are you starting? What can you see?
              2. What do you click?
              3. More steps…
      validations:
          required: true
    - type: textarea
      id: result
      attributes:
          label: Outcome
          placeholder: Tell us what went wrong
          value: |
              #### What did you expect?

              #### What happened instead?
      validations:
          required: true
    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: Windows 11, macOS 14, Ubuntu 24.04…
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: App version
          description: Find it in Settings → Help & About.
          placeholder: e.g. Blackout desktop 1.0.0-beta.3
      validations:
          required: false
    - type: input
      id: tauri-version
      attributes:
          label: Tauri runtime version
          description: From the About dialog or `Help → About`.
          placeholder: e.g. Tauri 2.0.0
      validations:
          required: false
    - type: input
      id: source
      attributes:
          label: Install source
          description: Where did you install from? Link or describe the artifact.
          placeholder: e.g. GitHub releases v1.0.0-beta.3 (.dmg), Flathub, sideloaded
      validations:
          required: true
    - type: dropdown
      id: keychain
      attributes:
          label: OS keychain backend (if known)
          options:
              - "macOS Keychain"
              - "Windows Credential Manager"
              - "Linux Secret Service / KWallet / GNOME Keyring"
              - "Unknown"
      validations:
          required: false
    - type: dropdown
      id: signing
      attributes:
          label: Did install warn about an unsigned / untrusted build?
          options:
              - "No (signature verified)"
              - "Yes (warned, proceeded anyway)"
              - "Yes (blocked by OS)"
              - "Don't remember"
      validations:
          required: false
    - type: input
      id: homeserver
      attributes:
          label: Homeserver
          placeholder: e.g. matrix.theblackout.app
      validations:
          required: false
    - type: dropdown
      id: rageshake
      attributes:
          label: Will you send logs?
          options:
              - "Yes"
              - "No"
      validations:
          required: true
