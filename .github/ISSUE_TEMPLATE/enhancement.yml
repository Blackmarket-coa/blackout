name: Enhancement request
description: Suggest an improvement to an existing feature. For brand-new features or cross-cutting ideas, prefer a Discussion.
labels: [T-Enhancement, needs-triage]
body:
    - type: markdown
      attributes:
          value: |
              For brand-new features or large cross-cutting ideas, please open a
              [Discussion](https://github.com/Blackmarket-coa/blackout/discussions/new/choose) first
              (Roadmap, Plugin Ideas, or Governance categories) so we can gather signal before opening an issue.
    - type: textarea
      id: usecase
      attributes:
          label: Your use case
          description: What would you like to be able to do? Mock-ups or screenshots welcome.
          value: |
              #### What would you like to do?

              #### Why would you like to do it?

              #### How would you like to achieve it?
      validations:
          required: true
    - type: textarea
      id: alternative
      attributes:
          label: Alternatives considered
          placeholder: Other approaches you thought about.
      validations:
          required: false
    - type: input
      id: coliseum-link
      attributes:
          label: Linked Coliseum challenge (optional)
          description: If this enhancement came out of a Coliseum challenge, paste the challenge ID (e.g. `challenge:onboarding`).
          placeholder: challenge:onboarding
      validations:
          required: false
    - type: textarea
      id: additional-context
      attributes:
          label: Additional context
          placeholder: Anything else worth noting.
      validations:
          required: false
