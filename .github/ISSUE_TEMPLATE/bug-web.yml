name: Bug report (Blackout web client)
description: File a bug for the Blackout web client (Firefox, Chrome, Edge, Safari).
labels: [T-Defect, surface:web, needs-triage]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to file a bug.

              **Security vulnerabilities do not go here.** File those via
              [Security Advisories](https://github.com/Blackmarket-coa/blackout/security/advisories/new) —
              see [`SECURITY.md`](https://github.com/Blackmarket-coa/blackout/blob/develop/SECURITY.md) for the full policy.
    - type: textarea
      id: reproduction-steps
      attributes:
          label: Steps to reproduce
          description: Attach screenshots, videos, or logs if you can.
          placeholder: Tell us what you see!
          value: |
              1. Where are you starting? What can you see?
              2. What do you click?
              3. More steps…
      validations:
          required: true
    - type: textarea
      id: result
      attributes:
          label: Outcome
          placeholder: Tell us what went wrong
          value: |
              #### What did you expect?

              #### What happened instead?
      validations:
          required: true
    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: Windows 11, macOS 14, Ubuntu 24.04, Arch Linux…
      validations:
          required: false
    - type: input
      id: browser
      attributes:
          label: Browser
          description: Which browser and version?
          placeholder: e.g. Firefox 124, Chrome 122
      validations:
          required: false
    - type: input
      id: webapp-url
      attributes:
          label: URL
          description: Which Blackout URL are you using? If a self-hosted instance, mention the version.
          placeholder: e.g. https://matrix.theblackout.app
      validations:
          required: false
    - type: input
      id: version
      attributes:
          label: Application version
          description: Find it in Settings → Help & About.
          placeholder: e.g. Blackout 1.0.0-beta.3
      validations:
          required: false
    - type: input
      id: homeserver
      attributes:
          label: Homeserver
          description: Which homeserver hosts your account? Mention implementation + version if non-default.
          placeholder: e.g. matrix.theblackout.app, or Synapse 1.50.0
      validations:
          required: false
    - type: dropdown
      id: rageshake
      attributes:
          label: Will you send logs?
          description: |
              You can send a `/rageshake` command in chat to submit logs for this issue. Trigger the defect, then type `/rageshake` followed by a description of the problem.
          options:
              - "Yes"
              - "No"
      validations:
          required: true
