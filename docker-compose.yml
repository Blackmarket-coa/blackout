services:
  blackout-app:
    build:
      context: .
      dockerfile: Dockerfile.blackout
    container_name: blackout-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      ELEMENT_WEB_PORT: 80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - blackout-backend

networks:
  blackout-backend:
    name: blackout-backend
    external: true
