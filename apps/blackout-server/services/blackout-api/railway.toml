[build]
builder = "DOCKERFILE"
dockerfilePath = "services/blackout-api/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production]
RAILWAY_RUN_ROOT = "services/blackout-api"
watchPatterns = ["services/blackout-api/**"]
BLACKOUT_API_DATABASE_URL = "${{Postgres.DATABASE_URL}}"
BLACKOUT_API_JWT_AUDIENCE = "blackout-api"
BLACKOUT_API_JWT_ISSUER = "blackout-auth"
