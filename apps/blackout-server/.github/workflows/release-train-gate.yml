name: Release train gate

on:
  pull_request:
  push:
    branches: ["develop", "release-*"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify-release-train-artifacts:
    name: Verify release checklist/changelog artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local package
        run: pip install .
      - name: Run release train gate
        run: python scripts-dev/check_release_train_gate.py
      - name: Run divergence marker gate
        run: python scripts-dev/check_divergence_markers.py
      - name: Run tracker evidence validator
        run: bash scripts-dev/blackout/validate_tracker_evidence.sh
      - name: Run protocol compatibility smoke check
        run: python -m pytest tests/rest/client/test_versions.py::VersionsServletTestCase::test_versions_smoke_compatibility
