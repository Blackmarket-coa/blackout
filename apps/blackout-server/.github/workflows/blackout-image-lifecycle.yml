name: Blackout image lifecycle

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set build metadata
        id: meta
        run: |
          VERSION=$(python - <<'PY'
import tomllib
from pathlib import Path
data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
print(data["tool"]["poetry"]["version"])
PY
)
          UPSTREAM_BASE=$(python - <<'PY'
import json
from pathlib import Path
p = Path("release/train/image_provenance.json")
if p.exists():
    data = json.loads(p.read_text(encoding="utf-8"))
    print(data.get("upstream_base_revision", "unknown"))
else:
    print("unknown")
PY
)
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_base=${UPSTREAM_BASE}" >> "$GITHUB_OUTPUT"
          echo "created=${CREATED}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/blackout-server"
          TAGS=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${IMAGE}:${{ steps.meta.outputs.version }},${IMAGE}:stable"
          else
            TAGS="${IMAGE}:canary"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/blackout-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            io.blackout.upstream_base_revision=${{ steps.meta.outputs.upstream_base }}

