# Minimal hardened coturn template for Blackout signaling deployments.
# Use with compose profile in docker/compose.turn.yaml.

listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_SHARED_SECRET
realm=CHANGE_ME_REALM

# Relay over UDP+TCP. TLS can be added separately when certs are provisioned.
no-tls
no-dtls

# Prevent open relay behavior.
no-multicast-peers
no-loopback-peers
no-cli
stale-nonce=600
total-quota=1200
bps-capacity=0

# Keep relay range explicit for firewalling.
min-port=49152
max-port=49200

# Logging suitable for container usage.
simple-log
stdout-log
