[package]
# We name the package `synapse` so that things like logging have the right
# logging target.
name = "synapse"

# dummy version. See pyproject.toml for the Synapse's version number.
version = "0.1.0"

edition = "2021"
rust-version = "1.83.0"

[lib]
name = "synapse"
# We generate a `cdylib` for Python and a standard `lib` for running
# tests/benchmarks.
crate-type = ["lib", "cdylib"]

# This is deprecated, see tool.maturin in pyproject.toml.
# It is left here for compatibilty with maturin < 0.15.
[package.metadata.maturin]
# This is where we tell maturin where to place the built library.
name = "synapse.synapse_rust"

[dependencies]
anyhow = "1.0.63"
lazy_static = "1.4.0"
log = "0.4.17"
# 0.29.0 fixes GHSA-36hh-v3qg-5jq4 (High) and GHSA-chgr-c6px-7xpp; 0.24.1 fixed
# GHSA-pph8-gcv7-4qj5. pyo3-log and pythonize must track the same pyo3 line.
pyo3 = { version = "0.29.3", features = [
    "macros",
    "anyhow",
    "abi3",
    # Synapse requires Python 3.11 or later (pyproject.toml).
    "abi3-py311",
] }
pyo3-log = "0.13.4"
pythonize = "0.29.0"
regex = "1.6.0"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0.85"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[build-dependencies]
blake2 = "0.10.4"
hex = "0.4.3"
