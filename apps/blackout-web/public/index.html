<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackout Frontend</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f8fafc;
        background: radial-gradient(circle at top, #182544, #020617 55%);

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
      }

      p {
        margin: 0;
        color: #cbd5e1;
      }

      code {
        color: #a5b4fc;
      }
    </style>
  </head>
  <body>
    <h1>Blackout frontend is reachable ✅</h1>
    <p>This is the placeholder shell for <code>apps/blackout-web</code>.</p>
    <p>Service health endpoint: <code>/health</code></p>
  </body>
</html>
