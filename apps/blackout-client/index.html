        />
        <meta name="theme-color" content="#000000" />

        <script>
            // Pre-hydration theme guard (Workstream F): paint the persisted theme's
            // critical colors before the app bundle loads so switching to light /
            // AMOLED doesn't flash the dark default on every boot. Only the surface
            // and primary text colors are seeded here as inline variables; the real
            // vanilla-extract theme class (applied by ThemeProvider) replaces them —
            // applyThemeToRoot clears these inline seeds when it runs.
            //
            // BOOT_THEMES and BOOT_LEGACY MUST stay in sync with
            // src/app/styles/theme-engine.ts (themeTokenMap / colorScheme) and
            // normalizeThemeId's legacy map. The sync is enforced by
            // tests/unit/styles/theme-boot-parity.test.ts.
            (function () {
                var BOOT_THEMES = {
                    dark_canopy: { bg: '#0B0F10', text: '#F7FFF9', scheme: 'dark' },
                    light_grove: { bg: '#EFFFD1', text: '#102017', scheme: 'light' },
                    amoled_night: { bg: '#000000', text: '#F7FFF9', scheme: 'dark' },
                    storybook_meadow: { bg: '#FFFBEF', text: '#1D2C24', scheme: 'light' },
                    adventure_spectrum: { bg: '#121D1A', text: '#F4FFF8', scheme: 'dark' },
                };
                var BOOT_LEGACY = {
                    dark: 'dark_canopy',
                    light: 'light_grove',
                    amoled: 'amoled_night',
                };
                var id = 'dark_canopy';
                try {
                    var read = function (key) {
                        var raw = window.localStorage.getItem(key);
                        if (!raw) return null;
                        var parsed = JSON.parse(raw);
                        return parsed && typeof parsed.theme === 'string' ? parsed.theme : null;
                    };
                    var stored =
                        read('blackout.settings.v1') || read('blackout.settings.appearance.v1');
                    if (stored) id = BOOT_LEGACY[stored] || stored;
                } catch (e) {
                    // Storage unavailable or corrupt — keep the dark default.
                }
                if (!BOOT_THEMES[id]) id = 'dark_canopy';
                var theme = BOOT_THEMES[id];
                var root = document.documentElement;
                root.dataset.theme = id;
                root.dataset.themeBoot = '1';
                root.style.colorScheme = theme.scheme;
                root.style.setProperty('--bg-surface', theme.bg);
                root.style.setProperty('--text-primary', theme.text);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme.bg);
            })();
        </script>
