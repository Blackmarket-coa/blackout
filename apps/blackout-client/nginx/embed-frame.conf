# Framing policy for the Black Mask chat panel (/embed, /embed/*), launch-plan
# step B2.
#
# THIS IS THE DEFAULT, and it is the same as everywhere else: no framing.
# At container start, docker-entrypoint.d/40-black-mask-frame-ancestors.sh
# overwrites this file with an allow-list ONLY when BLACK_MASK_FRAME_ANCESTORS
# holds a valid list of origins. Unset, empty, or any invalid entry leaves
# this default in place.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
