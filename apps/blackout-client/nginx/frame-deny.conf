# Framing policy for every response except the Black Mask chat panel
# (launch-plan step B2): no site may put these pages in a frame.
#
# Included at server level in docker-nginx.conf AND re-included in every
# location that sets its own add_header, because nginx drops ALL inherited
# add_header directives from a block that declares any of its own.
#
# The CSP here carries only frame-ancestors; it does not restrict what the
# page itself may load.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
