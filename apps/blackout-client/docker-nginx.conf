server {

  listen 8080;

  listen [::]:8080;

  # Framing policy (launch-plan step B2): nothing served here may be framed,
  # except the Black Mask chat panel below, and that only from the origins in
  # BLACK_MASK_FRAME_ANCESTORS (empty by default, which also means "none").
  # See docs/black-mask-chat-panel-and-account-link.md.
  #
  # nginx rule that matters here: a location that declares ANY add_header
  # drops every add_header inherited from this server block. So each location
  # below that has its own add_header re-includes the framing headers itself.
  include /etc/nginx/blackout/frame-deny.conf;

  location /healthz {

    return 200 'ok';

    add_header Content-Type text/plain;

    # Re-included: the add_header above discards the server-level ones.
    include /etc/nginx/blackout/frame-deny.conf;

  }

  # Black Mask chat panel: /embed and /embed/* (and only those — /embedded is
  # not the panel; the client's isEmbedPath() uses the same two forms).
  # These are the ONLY locations that include embed-frame.conf, which is
  # "frame-ancestors 'none'" unless 40-black-mask-frame-ancestors.sh replaced it
  # at container start with a validated allow-list. Both serve the SPA shell;
  # the client renders the panel instead of the full app on these paths.
  #
  # The `if` refuses a request whose raw URI does not literally start with
  # /embed (e.g. /%65mbed/, //embed/), which nginx would otherwise normalise
  # into this location. The browser's location.pathname is the raw path, so
  # without this the panel's framing policy could be served to a page the
  # client does not treat as the panel. The refusal carries the deny headers,
  # not the panel's. (`add_header` and `return` are both allowed and safe
  # inside `if` in a location.)
  location = /embed {

    if ($request_uri !~ "^/embed(\?|$)") {
      include /etc/nginx/blackout/frame-deny.conf;
      return 404;
    }

    root /usr/share/nginx/html;

    include /etc/nginx/blackout/embed-frame.conf;

    rewrite ^ /index.html break;

  }

  location ^~ /embed/ {

    if ($request_uri !~ "^/embed/") {
      include /etc/nginx/blackout/frame-deny.conf;
      return 404;
    }

    root /usr/share/nginx/html;

    include /etc/nginx/blackout/embed-frame.conf;

    rewrite ^ /index.html break;

  }

  location / {

    root /usr/share/nginx/html;

    rewrite ^/config.json$ /config.json break;

    rewrite ^/manifest.json$ /manifest.json break;

    rewrite ^/sw.js$ /sw.js break;

    rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

    # Public trust page. Generated from TRUST.md into public/trust.html, so it
    # ships in the build output at the site root. It needs its own rule because
    # the catch-all below rewrites every unmatched path to the SPA's index.html
    # — without this, /trust would silently boot the chat app instead.
    #
    # Served as a plain document on purpose: it must render with no JavaScript,
    # no login, and no third-party requests, for someone evaluating whether to
    # trust this service before they have an account.
    rewrite ^/trust/?$ /trust.html break;

    rewrite ^/trust\.html$ /trust.html break;

    rewrite ^/public/(.*)$ /public/$1 break;

    rewrite ^/assets/(.*)$ /assets/$1 break;

    rewrite ^(.+)$ /index.html break;

  }

}
